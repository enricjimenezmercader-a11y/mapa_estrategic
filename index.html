<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mapa Estratègic — Retícula Hexagonal</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 20px;
      gap: 20px;
      position: relative; /* Necessari per posicionar el marcador de temps */
    }

    #titleBar {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
    }

    #actionBar {
      width: 66%;
      height: 20px;
      background: #333;
      border: 1px solid #666;
      margin-top: -10px;
      margin-bottom: 10px;
      position: relative;
    }

    #actionFill {
      height: 100%;
      background: #00cc00;
      width: 0%;
      transition: width 0.3s ease;
    }

    .map-container {
      position: relative;
      background: #1a1a1a;
      border: 1px solid #333;
      overflow: hidden;
    }

    .map-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 1;
      pointer-events: none;
    }

    svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    .hex {
      stroke: #000;
      stroke-width: 2;
      cursor: pointer;
    }

    .hex-red { fill: rgba(255, 0, 0, 0.33); }
    .hex-blue { fill: rgba(0, 120, 255, 0.33); }
    .hex-mar { fill: rgba(120, 120, 120, 0.33); }

    .hex-hatch {
      fill: url(#hatch-red);
    }

    .hex-label {
      fill: #fff;
      font-weight: bold;
      text-anchor: middle;
      pointer-events: none;
      stroke: #000;
      stroke-width: 0.8;
    }

    #orders {
      width: 66%;
      color: #7CFF7C;
      font-family: monospace;
      font-size: 18px;
      white-space: pre-line;
      min-height: 40px;
    }

    .order-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .order-btn {
      background: #550000;
      color: #fff;
      border: 1px solid #aa0000;
      padding: 3px 8px;
      cursor: pointer;
      font-size: 14px;
    }

    #confirmBtn {
      margin-top: 10px;
      padding: 6px 12px;
      background: #004400;
      color: #aaffaa;
      border: 1px solid #66ff66;
      cursor: pointer;
      font-size: 16px;
      display: block;
    }

    #warning, #warningActions {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 40px;
      font-weight: bold;
      color: #FF4444;
      text-shadow: 0 0 10px #000;
      opacity: 0;
      pointer-events: none;
      z-index: 999;
    }

    /* Estils per al marcador de temps */
    #timeInfo {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 12px;
      color: #aaa;
      background: rgba(0, 0, 0, 0.5);
      padding: 3px 6px;
      border-radius: 4px;
      z-index: 1000;
    }

    .blink {
      animation: blinkAnim 0.3s linear infinite;
    }

    @keyframes blinkAnim{
      0%{opacity:1;}
      50%{opacity:0;}
      100%{opacity:1;}
    }

    .attack-arrow{
      position:absolute;
      pointer-events:none;
      z-index:20;
      transform-origin:center center;
    }

    @keyframes shake {
      0%   { transform: translate(0,0); }
      25%  { transform: translate(1px,-1px); }
      50%  { transform: translate(-1px,1px); }
      75%  { transform: translate(1px,1px); }
      100% { transform: translate(0,0); }
    }
    .attack-arrow--shake{
      animation:shake 0.25s linear 1;
    }

    @keyframes glow {
      0%   { filter: drop-shadow(0 0 0px #fff); }
      50%  { filter: drop-shadow(0 0 12px #ffff66); }
      100% { filter: drop-shadow(0 0 0px #fff); }
    }
    .attack-arrow--glow{
      animation:glow 1.4s ease-in-out infinite;
    }
  </style>
</head>

<body>

<audio id="moveSound" src="https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/Move.wav"></audio>
<audio id="ordersSound" src="https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/Orders.wav"></audio>

<!-- Marcador de temps per a la lectura del CSV -->
<div id="timeInfo">Lectura CSV: 0 ms</div>

<!-- Títol i barra d'acció (només mostra accions disponibles) -->
<div id="titleBar">Equip vermell — Accions disponibles: ...</div>
<div id="actionBar"><div id="actionFill"></div></div>

<div class="map-container" id="mapContainer">
  <div id="warning">Ordre repetida</div>
  <div id="warningActions">Accions insuficients</div>

  <img class="map-image"
       src="https://github.com/enricjimenezmercader-a11y/mapa_estrategic/blob/481d1cc0765b31581a6f050a7f68d53400172e48/map_hex.jpg?raw=true"
       alt="Mapa estratègic">

  <svg id="hexGrid"></svg>
</div>

<div id="orders"></div>
<button id="confirmBtn">Confirmar ordres</button>

<script>
const PATTERN=[5,4,5,4,5,4,5,4,5,4,5];
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vS8k769FG5aF_PK-AmHLVdcfc6sgJeeIhWkL9Q8Gcrs39JW9GyJid_OtHcwhN9r3xhFvWPrc_yigZiY/pub?output=csv";

const REAL_R=41.78;
const REAL_GRID_WIDTH=17*REAL_R;
const IMAGE_RATIO=1.4;

let hexData=[]; // Dades de les hexàgons dibuixades
let selectedRed=null; // Hexàgon vermell seleccionat actualment
let highlightedAdjacents=[]; // Hexàgons blaus adjacents ressaltats
let ordersSet=new Set(); // Conjunt d'ordres pendents
let actionsAvailable=0; // Accions totals disponibles (llegit del CSV)
let arrowImages={}; // Referències a les imatges de les fletxes d'atac
let clickLocked=false; // Estat de bloqueig de clics

// Variables per guardar l'estat actual del CSV
let hexColors = {}; // Mapa {id: color} de les hexàgons
let currentActionsAvailable = 0; // Valor H2 llegit del CSV, per comparar si ha canviat

let lastCsvReadTime = Date.now();
let timeInfoElement; // Element div per mostrar informació de temps

// ------------------------------
// LECTURA CSV AMB CACHE-BUSTER
// ------------------------------
async function fetchCSVText(){
  const startTime = Date.now();
  // Utilitza `Date.now()` com a cache-buster a la URL
  const res = await fetch(CSV_URL + "&cb=" + Date.now());
  if (!res.ok) {
    throw new Error(`HTTP error! status: ${res.status}`);
  }
  const text = await res.text();
  const endTime = Date.now();
  const duration = endTime - startTime;
  // Retorna el text del CSV i la durada de la descàrrega
  return { text, duration };
}

// ------------------------------
// PROCESSAMENT DE DADES I ACTUALITZACIÓ DEL DOM
// ------------------------------
async function processCSVData() {
  const processStartTime = Date.now(); // Marca l'inici del processament

  try {
    // Obtenir el text del CSV i la durada de la descàrrega
    const { text, duration: fetchDuration } = await fetchCSVText();
    lastCsvReadTime = Date.now(); // Actualitza el moment de la darrera lectura correcta

    const lines = text.trim().split("\n");

    const newColors = {}; // Mapa temporal per als nous colors llegits
    let H2 = 0; // Variable temporal per al nou valor d'accions disponibles

    // Parsejar cada línia del CSV
    lines.forEach((line, index) => {
      const cols = line.split(",");
      // Assumim que H2 (accions disponibles) està a la segona línia (index 1), columna 8 (index 7)
      if (index === 1) {
          const parsedH2 = parseInt(cols[7]);
          if (!isNaN(parsedH2)) {
              H2 = parsedH2;
          }
      }
      // A partir de la tercera línia (index 2), assumeix que són dades de hexàgons
      // El codi original sembla assumir que els hexàgons comencen a l'índex 0 i no s'ignoren capçaleres.
      // Ajustem per parsejar hexàgons si el format del CSV ho requereix
      // Si les primeres línies són capçalera, s'haurien d'ignorar o ajustar els índexos
      // El codi original utilitzava els índexos 0 i 1 per id i color per a *totes* les línies, incloses les primeres.
      // Si les primeres línies no tenen id/color, això podria donar problemes.
      // Per simplificar, mantenim la lògica original d'iterar sobre totes les línies, assumint que les dades d'id/color són vàlides.

      const id = cols[0];
      const color = cols[1];
      if (id) newColors[id.trim()] = color.trim().toUpperCase();
    });

    // Comprova si el nombre total d'accions disponibles ha canviat
    if (H2 !== currentActionsAvailable) {
      console.log(`Actions available changed from ${currentActionsAvailable} to ${H2}`);
      currentActionsAvailable = H2;
      actionsAvailable = H2; // Actualitza la variable global d'accions disponibles
      updateActionDisplay(); // Actualitza la interfície d'accions
    }

    // Comprova si els colors de les hexàgons han canviat
    let colorsChanged = false;
    // Compara el nombre de hexàgons
    if (Object.keys(hexColors).length !== Object.keys(newColors).length) {
        colorsChanged = true;
    } else {
        // Compara el color de cada hexàgon
        for (const id in newColors) {
            if (hexColors[id] !== newColors[id]) {
                colorsChanged = true;
                break;
            }
        }
    }
    hexColors = newColors; // Actualitza els colors emmagatzemats

    // Si els colors han canviat, redibuixa el grid
    if (colorsChanged) {
      console.log("Hex colors have changed. Redrawing grid.");
      await drawHexGrid(); // Redibuixa el mapa amb les noves dades de color
      setupClickHandler(); // Re-estableix els event listeners després de redibuixar
      updateActionDisplay(); // Assegura que la display d'accions sigui correcta
    }

    // Comprova també l'estat de bloqueig del botó 'Confirmar ordres'
    checkLockState();

    // Actualitza el marcador de temps amb la durada de la descàrrega i del processament
    const processEndTime = Date.now();
    const totalDuration = processEndTime - processStartTime;
    updateTimeInfo(fetchDuration, totalDuration);

  } catch (err) {
    console.error("Error processing CSV data:", err);
    updateTimeInfo(0, 0, true); // Indica error al marcador de temps
  }
}

// Interval per cridar a processCSVData cada segon
setInterval(processCSVData, 1000);

// ------------------------------
// FUNCIONS DE LA INTERFÍCIE
// ------------------------------

// Modificada per mostrar només les accions disponibles
function updateActionDisplay(){
  // Actualitza el títol només amb les accions disponibles
  document.getElementById("titleBar").textContent=
    `Equip vermell — Accions disponibles: ${actionsAvailable}`;

  // L'amplada de la barra d'acció ara es calcula basant-se en l'ús (si es vol mantenir visualment)
  // o es podria posar al 100% si només mostra el total.
  // Aquí mantenim el càlcul basat en l'ús per si encara té sentit visual,
  // però eliminem la visualització explícita de "gastades/restants" al títol.
  const spent = usedPoints(); // Calcula punts gastats per a la visualització de la barra
  let pct = 0;
  if (actionsAvailable > 0) { // Evita divisió per zero
      pct = Math.min(100, (spent / actionsAvailable) * 100);
  }
  // Si la barra d'acció no hauria de reflectir l'ús, es podria posar:
  // document.getElementById("actionFill").style.width = "100%";
  document.getElementById("actionFill").style.width = pct + "%";
}

function resizeMap(){
  const map=document.getElementById("mapContainer");
  const W=window.innerWidth;
  const H=window.innerHeight;
  const maxW=W*(2/3);
  const maxH=H*(2/3);
  let width=maxW;
  let height=width/IMAGE_RATIO;
  if(height>maxH){
    height=maxH;
    width=height*IMAGE_RATIO;
  }
  map.style.width=width+"px";
  map.style.height=height+"px";
}

// Aquesta funció DIBUIXA la retícula utilitzant les dades globals hexColors
async function drawHexGrid(){
  const svg=document.getElementById("hexGrid");
  const map=document.getElementById("mapContainer");

  svg.innerHTML=""; // Neteja el contingut SVG anterior
  hexData=[]; // Reinicia les dades de les hexàgons dibuixades
  selectedRed=null; // Reinicia la selecció
  highlightedAdjacents=[];
  arrowImages={}; // Neteja referències a fletxes
  ordersSet=new Set(); // Reinicia les ordres
  document.getElementById("orders").innerHTML=""; // Neteja la llista d'ordres a la UI

  // Definició del patró de ratllat per a les hexàgons adjacents ressaltades
  svg.insertAdjacentHTML("afterbegin",`
    <defs>
      <pattern id="hatch-red" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(255,0,0,0.5)" stroke-width="3"/>
      </pattern>
    </defs>
  `);

  // Utilitza les dades globals 'hexColors' que s'actualitzen periòdicament
  const colors = hexColors;

  const B=map.clientWidth; // Amplada del contenidor del mapa
  const scale=B/REAL_GRID_WIDTH; // Factor d'escala basat en l'amplada del mapa
  const R=REAL_R*scale; // Radi de l'hexàgon escalat
  const hexH=Math.sqrt(3)*R; // Alçada d'un hexàgon

  const maxRows=Math.max(...PATTERN); // Nombre màxim de files en una columna
  const gridHeight=(maxRows-1)*hexH+hexH; // Alçada total de la retícula
  const A=17*R; // Amplada total de la retícula en unitats de hexàgon

  // Calcula els desplaçaments per centrar la retícula al contenidor
  const offsetX=(B-A)/2+R;
  const offsetY=(map.clientHeight-gridHeight)/2+hexH/2;

  let id=1; // Contador per a l'ID de cada hexàgon

  // Dibuixa cada hexàgon
  PATTERN.forEach((rowCount,col)=>{
    for(let r=0;r<rowCount;r++){
      // Calcula les coordenades del centre de l'hexàgon
      const cx=offsetX+col*1.5*R;
      const cy=offsetY+r*hexH+(col%2===0?0:hexH/2);

      // Calcula els vèrtexs del polígon
      const pts=[];
      for(let i=0;i<6;i++){
        const ang=Math.PI/3*i;
        pts.push([cx+R*Math.cos(ang),cy+R*Math.sin(ang)].join(","));
      }

      const g=document.createElementNS("http://www.w3.org/2000/svg","g"); // Grup SVG per a cada hexàgon

      const poly=document.createElementNS("http://www.w3.org/2000/svg","polygon");
      poly.setAttribute("points",pts.join(" "));

      // Obté el color de les dades globals 'colors'
      const color=(colors[id]||"").toUpperCase();
      let cls="hex hex-mar"; // Classe per defecte (marró/gris)
      if(color.includes("RED")) cls="hex hex-red";
      else if(color.includes("BLUE")) cls="hex hex-blue";

      poly.setAttribute("class",cls); // Assigna la classe de color
      poly.dataset.id=id; // Assigna l'ID a l'element per poder-lo referenciar

      g.appendChild(poly); // Afegeix el polígon al grup

      // Crea i afegeix l'etiqueta (número) de l'hexàgon
      const label=document.createElementNS("http://www.w3.org/2000/svg","text");
      label.setAttribute("x",cx);
      label.setAttribute("y",cy+4);
      label.setAttribute("class","hex-label");
      label.textContent=id;
      g.appendChild(label);

      svg.appendChild(g); // Afegeix el grup (hexàgon+etiqueta) al SVG

      // Guarda les dades de l'hexàgon per a ús posterior (selecció, ordres, etc.)
      hexData.push({id,cx,cy,color,element:poly});
      id++;
    }
  });
}

// ------------------------------
// BLOQUEIG DINÀMIC PER E1 (DES DEL CSV)
// ------------------------------
async function checkLockState() {
  try {
    // Només necessitem el text del CSV per comprovar E1
    const { text } = await fetchCSVText();
    const lines = text.trim().split("\n");
    if (lines.length > 0) {
        const cols = lines[0].split(","); // Assumim E1 a la línia 0, columna 4
        const E1 = cols[4].trim();

        const btn = document.getElementById("confirmBtn");

        btn._sheetLocked = (E1 === "1"); // Bloquejat si E1 és '1'

        // Actualitza l'aparença i l'estat del botó
        if (btn._sheetLocked || btn._tempLocked) {
          btn.disabled = true;
          btn.style.background = "#555";
          btn.style.color = "#999";
          btn.style.cursor = "not-allowed";
        } else {
          btn.disabled = false;
          btn.style.background = "#004400";
          btn.style.color = "#aaffaa";
          btn.style.cursor = "pointer";
        }
    }
  } catch (err) {
    console.log("Error checkLockState:", err);
  }
}

// ------------------------------
// FUNCIONS AUXILIARS
// ------------------------------

function highlightAdjacent(redHex){
  clearHighlights();
  selectedRed=redHex;

  // Calcula la distància màxima per considerar hexàgons adjacents
  const R=REAL_R*(document.getElementById("mapContainer").clientWidth/REAL_GRID_WIDTH);
  const maxDist=Math.sqrt(3)*R*1.01; // Marge lleuger per assegurar adjacència

  highlightedAdjacents=[];

  // Rssalta només els hexàgons blaus adjacents al vermell seleccionat
  hexData.forEach(h=>{
    if(h.color==="BLUE"){
      const dx=h.cx-redHex.cx;
      const dy=h.cy-redHex.cy;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<=maxDist){
        h.element.classList.add("hex-hatch"); // Aplica el patró de ratllat
        highlightedAdjacents.push(h);
      }
    }
  });
}

function clearHighlights(){
  highlightedAdjacents.forEach(h=>h.element.classList.remove("hex-hatch"));
  highlightedAdjacents=[];
  selectedRed=null;
}

function showWarning(){
  const w=document.getElementById("warning");
  w.classList.add("blink");
  w.style.opacity=1;
  setTimeout(()=>{w.style.opacity=0;w.classList.remove("blink");},2000);
}

function showWarningActions(){
  const w=document.getElementById("warningActions");
  w.classList.add("blink");
  w.style.opacity=1;
  setTimeout(()=>{w.style.opacity=0;w.classList.remove("blink");},2000);
}

// Calcula els punts "gastats" basant-se en el nombre d'ordres actives
function usedPoints(){ return ordersSet.size*10; }

function direction(origin,target){
  const dx=target.cx-origin.cx;
  const dy=target.cy-origin.cy;

  if(dy<0 && Math.abs(dx)<Math.abs(dy)) return "N";
  if(dy>0 && Math.abs(dx)<Math.abs(dy)) return "S";
  if(dx>0 && dy<0) return "NE";
  if(dx>0 && dy>0) return "SE";
  if(dx<0 && dy<0) return "NO";
  if(dx<0 && dy>0) return "SO";

  return "N";
}

function arrowURL(dir){
  return {
    "N":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-N.svg",
    "NE":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-NE.svg",
    "NO":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-NO.svg",
    "S":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-S.svg",
    "SE":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-SE.svg",
    "SO":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-SO.svg"
  }[dir];
}

function placeArrow(origin,target,key){
  const map=document.getElementById("mapContainer");
  const B=map.clientWidth;
  const scale=B/REAL_GRID_WIDTH;
  const R=REAL_R*scale;
  const hexH=Math.sqrt(3)*R;

  const dir=direction(origin,target);
  const url=arrowURL(dir);

  const img=document.createElement("img");
  img.src=url;
  img.className="attack-arrow attack-arrow--shake attack-arrow--glow";

  const FACTOR=1.42;

  const width = 2 * R * FACTOR;
  const height = hexH * FACTOR;

  img.style.width  = width + "px";
  img.style.height = height + "px";
  img.style.left   = (origin.cx - width/2) + "px";
  img.style.top    = (origin.cy - height/2) + "px";

  map.appendChild(img);
  arrowImages[key]=img;

  setTimeout(()=>{
    if(img) img.classList.remove("attack-arrow--shake");
  },260);
}

function removeArrow(key){
  if(arrowImages[key]){
    arrowImages[key].remove();
    delete arrowImages[key];
  }
}

function addOrder(originID,targetID){
  const key=`${originID}-${targetID}`;

  if(ordersSet.has(key)){
    showWarning();
    return;
  }

  // Validació per assegurar prou accions disponibles (cost 10 punts per ordre)
  const remainingPoints = actionsAvailable - usedPoints();
  if (remainingPoints < 10) {
      showWarningActions();
      return;
  }

  ordersSet.add(key);

  // Bloqueig temporal de clics
  clickLocked = true;
  document.body.style.cursor = "wait";
  setTimeout(() => {
    clickLocked = false;
    document.body.style.cursor = "default";
  }, 1000);

  const origin=hexData.find(h=>h.id===originID);
  const target=hexData.find(h=>h.id===targetID);

  placeArrow(origin,target,key);

  target.element.classList.remove("hex-hatch"); // Treu el ressaltat del hexàgon de destí

  document.getElementById("moveSound").play();

  const orders=document.getElementById("orders");

  // Crea la línia per mostrar l'ordre a la UI
  const line=document.createElement("div");
  line.className="order-line";
  line.dataset.key=key;

  const text=document.createElement("span");
  text.textContent=`Ordre d'atac, territori ${originID} a territori ${targetID}`;

  const btn=document.createElement("button");
  btn.textContent="Suspendre ordre";
  btn.className="order-btn";

  btn.onclick=()=>{
    ordersSet.delete(key);
    removeArrow(key);
    line.remove();
    updateActionDisplay(); // Actualitza la UI quan es cancel·la una ordre
  };

  line.appendChild(text);
  line.appendChild(btn);
  orders.appendChild(line);

  updateActionDisplay(); // Actualitza la UI d'accions disponibles
}

function setupClickHandler(){
  const svg=document.getElementById("hexGrid");

  svg.addEventListener("click", e => {
    if (clickLocked) return; // Ignora clics si està bloquejat

    // Neteja qualsevol ressaltat anterior
    hexData.forEach(h=>h.element.classList.remove("hex-hatch"));

    const poly=e.target.closest("polygon"); // Troba el polígon clicat
    if(!poly){
      clearHighlights(); // Si es fa clic fora d'un hexàgon, neteja seleccions
      return;
    }

    const id=parseInt(poly.dataset.id);
    const hex=hexData.find(h=>h.id===id);

    if(hex.color==="RED"){ // Si es fa clic en un hexàgon vermell
      highlightAdjacent(hex); // Rssalta els adjacents possibles
      return;
    }

    // Si hi ha un hexàgon vermell seleccionat i es fa clic en un adjacent ressaltat
    if(selectedRed && highlightedAdjacents.some(h=>h.id===id)){
      addOrder(selectedRed.id,hex.id); // Afegeix l'ordre
      return;
    }

    clearHighlights(); // Si no és cap dels casos anteriors, neteja seleccions
  });
}

// Redibuixa el mapa (canvia la mida i redibuixa la retícula)
function redraw(){
  resizeMap();
  drawHexGrid().then(()=>{ // drawHexGrid utilitzarà les dades globals hexColors
    setupClickHandler(); // Reconfigura el listener de clics
    updateActionDisplay(); // Actualitza la display d'accions
  });
}

// ------------------------------
// ESDEVENIMENTS I ARRENCADA
// ------------------------------

window.addEventListener("resize", redraw); // Redibuixa si la finestra canvia de mida

// Funció per a la càrrega inicial de l'aplicació
async function initialLoad() {
  // Primer, carrega les dades del CSV i actualitza l'estat global
  await processCSVData();
  resizeMap(); // Ajusta el mapa a la mida de la finestra
  await drawHexGrid(); // Dibuixa la retícula amb les dades inicials carregades
  setupClickHandler(); // Configura el listener de clics
  updateActionDisplay(); // Mostra l'estat inicial de les accions
  checkLockState(); // Comprova l'estat de bloqueig inicial del botó
}

// Crida a la funció de càrrega inicial
initialLoad();

// Interval per comprovar l'estat de bloqueig del botó
setInterval(checkLockState, 1000);

// Botó Confirmar ordres: bloqueig temporal, cursor de rellotge i enviament seqüencial
document.getElementById("confirmBtn").addEventListener("click", async () => {
  const btn = document.getElementById("confirmBtn");

  // Evita accions si el full està bloquejat o temporalment bloquejat
  if (btn._sheetLocked || btn._tempLocked) return;

  // Bloqueig temporal del botó i canvi de cursor
  btn._tempLocked = true;
  btn.disabled = true;
  btn.style.background = "#555";
  btn.style.color = "#999";
  btn.style.cursor = "not-allowed";
  document.body.style.cursor = "wait";

  // Allibera el bloqueig temporal després de 5 segons
  setTimeout(() => {
    btn._tempLocked = false;
    document.body.style.cursor = "default";
    checkLockState(); // Torna a comprovar l'estat de bloqueig
  }, 5000);

  document.getElementById("ordersSound").play(); // Reprodueix so de confirmació

  // URL del Google Apps Script per enviar les ordres
  const url = "https://script.google.com/macros/s/AKfycbzMGXDTpJXy2jGjGxPT5g27kOntPOEj6aO-ap_8KIPqi1iyR-FQknxpNva-QqqTXxt_/exec";
  const lines = document.querySelectorAll(".order-line"); // Selecciona totes les ordres actives

  // Envia cada ordre seqüencialment
  for (const line of lines) {
    const text = line.querySelector("span").textContent;

    await fetch(url, {
      method: "POST",
      mode: "no-cors", // Necessari per enviar a Google Apps Script sense problemes de CORS
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ orderText: text }) // Envia l'ordre com a JSON
    });

    // Pausa breu entre enviaments
    await new Promise(res => setTimeout(res, 150));
  }
});
</script>
