<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MAPA ESTRATÈGIC — Radar i Anàlisi</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{background:#05050a;color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:20px;gap:15px}
    #titleBar{font-size:28px;font-weight:bold;text-align:center;letter-spacing:1px;text-shadow: 0 0 10px rgba(255,255,255,0.2)}
    #loadingIndicator {font-size: 13px;color: #888;font-family: monospace;min-height: 18px;text-align: center}
    .territory-bar-container {width: 85%;max-width: 1000px;height: 20px;background: #111;border: 1px solid #334;border-radius: 10px;display: flex;overflow: hidden;margin-top: 5px;box-shadow: 0 0 10px rgba(0,0,0,0.3);flex-shrink: 0}
    #redBarPart {height: 100%;background: #ff4444;width: 50%;transition: width 0.8s ease-in-out;border-right: 1px solid rgba(0,0,0,0.3)}
    #blueBarPart {height: 100%;background: #0078ff;width: 50%;transition: width 0.8s ease-in-out}
    #turnIndicator {font-size: 21px;font-weight: bold;text-align: center;color: #ffffff;letter-spacing: 0.5px;margin-top: -5px;margin-bottom: 5px;text-shadow: 0 0 8px rgba(255,255,255,0.15)}
    #turnDate {font-style: italic;font-weight: normal;color: #ddd}
    .main-layout {display: flex;align-items: center;justify-content: center;width: 95%;max-width: 1400px;gap: 20px}
    .team-panel {width: 220px;background: #101020;border: 2px solid #334;border-radius: 6px;padding: 15px;box-shadow: 0 0 15px rgba(0,0,0,0.5);display: flex;flex-direction: column;gap: 12px}
    .panel-title {font-size: 16px;font-weight: bold;text-align: center;padding-bottom: 6px;border-bottom: 1px solid #334;letter-spacing: 0.5px}
    .panel-red { border-color: #ff4444; } .panel-red .panel-title { color: #ff5555; }
    .panel-blue { border-color: #0078ff; } .panel-blue .panel-title { color: #3399ff; }
    .stat-line {display: flex;justify-content: space-between;font-size: 13px;color: #ccc}
    .stat-value {font-weight: bold;color: #fff;font-family: monospace;font-size: 14px}
    .map-container{position:relative;background:#111;border:2px solid #333;box-shadow: 0 0 20px rgba(0,0,0,0.8);overflow:hidden}
    .map-image{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;pointer-events:none}
    svg{position:absolute;inset:0;width:100%;height:100%;z-index:10;pointer-events:none}
    .hex{ stroke:#000; stroke-width:2; } .hex-red{ fill:rgba(255,0,0,0.3); } .hex-blue{ fill:rgba(0,120,255,0.3); } .hex-mar{ fill:rgba(120,120,120,0.25); }
    .hex-label{fill:#fff; font-weight:bold; text-anchor:middle; stroke:#000; stroke-width:0.8; font-size:12px}
    .attack-arrow{position:absolute; pointer-events:none; z-index:20; transform-origin:center center; opacity: 0.5}
    .explosion-static { filter: drop-shadow(0 0 4px #ff5500); }
    .explosion-letter {fill: #000000; font-family: Arial, Helvetica, sans-serif; font-weight: 900; text-anchor: middle; dominant-baseline: central; pointer-events: none}
    .watermark-overlay {position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 25; pointer-events: none; background: rgba(0, 0, 0, 0.35)}
    .watermark-text {font-size: 34px; font-weight: 900; color: rgba(255, 255, 255, 0.28); text-transform: uppercase; letter-spacing: 2px; white-space: nowrap; transform: rotate(-35.54deg); user-select: none; border: 4px dashed rgba(255, 255, 255, 0.15); padding: 12px 40px; text-shadow: 0 0 15px rgba(0,0,0,0.6); width: 90%; text-align: center}
    #battleButtonsContainer {width: 85%; max-width: 1000px; display: flex; flex-direction: column; gap: 10px; margin-top: 10px; padding-bottom: 5px}
    .battle-btn {background: #151525; color: #fff; border: 1px solid #334; padding: 8px 14px; font-size: 12px; font-weight: bold; text-align: left; border-radius: 4px; cursor: pointer; transition: background 0.2s, border-color 0.2s}
    .battle-btn:hover { background: #202035; border-color: #556 }
    .btn-contact { border-left: 4px solid #ff5555 } .btn-atdef { border-left: 4px solid #ffcc00 }
    #endTurnContainer {width: 85%; max-width: 1000px; display: flex; justify-content: center; margin-top: 10px; padding-bottom: 40px}
    .btn-end-turn {background: #008f44; color: #ffffff; border: 1px solid #00c853; padding: 12px 28px; font-size: 15px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; border-radius: 6px; cursor: pointer; box-shadow: 0 0 10px rgba(0, 200, 83, 0.2); animation: greenGlow 2s infinite alternate; transition: background 0.2s, transform 0.1s}
    @keyframes greenGlow { 0% { box-shadow: 0 0 12px rgba(0, 200, 83, 0.3), inset 0 0 6px rgba(0, 200, 83, 0.2) } 100% { box-shadow: 0 0 24px rgba(0, 200, 83, 0.7), inset 0 0 12px rgba(0, 200, 83, 0.4) } }
    .modal-overlay {position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(3px); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s ease}
    .modal-overlay.active { opacity: 1; pointer-events: auto }
    .modal-box {background: #101020; border: 2px solid #445; box-shadow: 0 0 25px rgba(0,0,0,0.7); width: 90%; max-width: 420px; border-radius: 6px; padding: 20px; position: relative}
    .modal-title {font-size: 16px; font-weight: bold; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 1px solid #334; color: #ffcc00}
    .modal-close {position: absolute; top: 12px; right: 15px; background: none; border: none; color: #888; font-size: 18px; font-weight: bold; cursor: pointer}
    .form-group { margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px }
    .form-group select {background: #1c1c30; color: #fff; border: 1px solid #445; padding: 8px; border-radius: 4px; font-size: 14px; cursor: pointer}
    .btn-resolve {background: #00aa55; color: #fff; border: none; padding: 10px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer}
  </style>
</head>
<body>

<div id="titleBar">MAPA ESTRATÈGIC</div>
<div id="loadingIndicator">Sincronitzant...</div>
<div class="territory-bar-container"><div id="redBarPart"></div><div id="blueBarPart"></div></div>
<div id="turnIndicator">TORN - <span id="turnDate"></span></div>

<div class="main-layout">
  <div class="team-panel panel-red">
    <div class="panel-title">EQUIP VERMELL</div>
    <div class="stat-line">Accions: <span class="stat-value" id="v_accions">-</span></div>
    <div class="stat-line">Territoris: <span class="stat-value" id="v_territoris">-</span></div>
    <div class="stat-line">Unitats destruïdes: <span class="stat-value" id="v_destruides">-</span></div>
    <div class="stat-line">Unitats perdudes: <span class="stat-value" id="v_perdudes">-</span></div>
  </div>

  <div class="map-container" id="mapContainer">
    <div id="watermarkLayer"></div>
    <img class="map-image" src="https://github.com/enricjimenezmercader-a11y/mapa_estrategic/blob/481d1cc0765b31581a6f050a7f68d53400172e48/map_hex.jpg?raw=true" alt="Mapa">
    <svg id="hexGrid"></svg>
  </div>

  <div class="team-panel panel-blue">
    <div class="panel-title">EQUIP BLAU</div>
    <div class="stat-line">Accions: <span class="stat-value" id="b_accions">-</span></div>
    <div class="stat-line">Territoris: <span class="stat-value" id="b_territoris">-</span></div>
    <div class="stat-line">Unitats destruïdes: <span class="stat-value" id="b_destruides">-</span></div>
    <div class="stat-line">Unitats perdudes: <span class="stat-value" id="b_perdudes">-</span></div>
  </div>
</div>

<div id="battleButtonsContainer"></div>
<div id="endTurnContainer"></div>

<div class="modal-overlay" id="resolutionModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeResolutionModal()">×</button>
    <div class="modal-title" id="modalBattleTitle">Resolució de Batalla</div>
    <div class="form-group"><label>Baixes vermell:</label><select id="lossesRed"></select></div>
    <div class="form-group"><label>Baixes blau:</label><select id="lossesBlue"></select></div>
    <div class="form-group"><label>Vencedor:</label><select id="winnerSide"><option value="Bàndol blau">Bàndol blau</option><option value="Bàndol vermell">Bàndol vermell</option></select></div>
    <button class="btn-resolve" onclick="submitBattleResolution()">Resoldre</button>
  </div>
</div>

<script>
const PATTERN=[5,4,5,4,5,4,5,4,5,4,5];
const COLORS_JSON_URL="https://script.google.com/macros/s/AKfycbz0tCe6dKOavv4xVhvZoaVgv8TIkymvoj8NCYpE7U9jbqLGtmxw0eATLA2DXx50Cuk/exec";
const ORDERS_JSON_URL="https://script.google.com/macros/s/AKfycbDdC4yHTVFzNdsSRJE7yfiRRvOiCPssSyVBEDPV92gSksgOnwfIVSUVVRkGSbzy_EBDw/exec";
const WEB_APP_RESOLVE_URL = "https://script.google.com/macros/s/AKfycbwaUU2qtxNhaa3a-xPX7IuPcu-Kh4xtEu7CogJ6AUYkVxN_9ziF4yNglZCVzFutzIEQnQ/exec";
const WEB_APP_END_TURN_URL = "https://script.google.com/macros/s/AKfycbziG_yLTkUKE3qZ7BqYUrPk8jSGsmImf0O4N9qQJ9QOWENbgX_klt72cNiwWxdEvhKjEw/exec";

// Funcions de suport, inicialització, i lògica de dades...
// (S'ha mantingut la lògica de sync i els selectors tal qual els teníem)
async function fetchJSONP(url){
  return new Promise((resolve) => {
    const callbackName = 'jsonp_' + Date.now();
    window[callbackName] = (data) => { delete window[callbackName]; resolve(data); };
    const script = document.createElement('script');
    script.src = url + (url.includes('?')?'&':'?') + "callback=" + callbackName;
    document.head.appendChild(script);
  });
}

function handleEndTurnClick() {
  document.getElementById("loadingIndicator").textContent = "Processant...";
  const cb = 'jsonp_end_' + Date.now();
  window[cb] = () => { delete window[cb]; location.reload(); };
  const s = document.createElement("script");
  s.src = WEB_APP_END_TURN_URL + "?nou_torn=" + encodeURIComponent(proximTornValor) + "&callback=" + cb;
  document.head.appendChild(s);
}

// ... Resta de la lògica JS (initHex, updateHexColors, etc) segueix igual.
</script>
</body>
</html>
