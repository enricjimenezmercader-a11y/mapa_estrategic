<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Mapa Hexagonal</title>
<style>
  body { background:#222; color:white; font-family:Arial; }
  #map { display:flex; flex-wrap:wrap; width:800px; margin:auto; }
  .hex {
    width:60px;
    height:52px;
    background:gray;
    clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    margin:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    color:black;
    font-weight:bold;
  }
  #actions { text-align:center; font-size:24px; margin:20px; }
</style>
</head>

<body>

<h1 style="text-align:center;">Mapa Hexagonal</h1>
<div id="actions">Accions disponibles: <span id="actionsValue">0</span></div>
<div id="map"></div>

<script>
// ------------------------------------------------------------
// 1. URL del teu Apps Script (JSON estable)
// ------------------------------------------------------------
const DATA_URL = "https://script.google.com/macros/s/AKfycbz_pSDXfaxX20KC64P1N5EygoqiWALXF9LFaAdh8P15JUKvyISevu39Pmc6gNxfqHx3/exec";


// ------------------------------------------------------------
// 2. Funció per llegir el JSON del WebApp
// ------------------------------------------------------------
async function fetchSheetData() {
  const res = await fetch(DATA_URL + "?cb=" + Date.now(), { cache: "no-store" });
  return await res.json();
}


// ------------------------------------------------------------
// 3. Carregar COLORS del full
// ------------------------------------------------------------
async function loadColors() {
  const data = await fetchSheetData();
  const colors = {};

  data.forEach((row, index) => {
    if (index === 0) return; // header
    const id = row[0];
    const color = row[1];
    if (id) colors[id.trim()] = color.trim().toUpperCase();
  });

  return colors;
}


// ------------------------------------------------------------
// 4. Llegir H2 (accions disponibles)
// ------------------------------------------------------------
let actionsAvailable = 0;

async function updateActionsFromSheet() {
  const data = await fetchSheetData();
  const H2 = parseInt(data[1][7]); // fila 2, columna H

  if (!isNaN(H2)) {
    actionsAvailable = H2;
    updateActionDisplay();
  }
}

function updateActionDisplay() {
  document.getElementById("actionsValue").textContent = actionsAvailable;
}


// ------------------------------------------------------------
// 5. Crear el mapa hexagonal
// ------------------------------------------------------------
async function buildMap() {
  const mapDiv = document.getElementById("map");
  const colors = await loadColors();

  Object.keys(colors).forEach(id => {
    const hex = document.createElement("div");
    hex.className = "hex";
    hex.textContent = id;
    hex.style.background = colors[id];
    mapDiv.appendChild(hex);
  });
}


// ------------------------------------------------------------
// 6. Inicialització
// ------------------------------------------------------------
buildMap();
updateActionsFromSheet();

// Actualitzar H2 cada segon
setInterval(updateActionsFromSheet, 1000);

</script>

</body>
</html>
