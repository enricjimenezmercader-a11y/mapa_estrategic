<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Mapa Estratègic</title>
<style>
  body {
    background: #111;
    color: #ddd;
    font-family: Arial, sans-serif;
    margin: 0;
    overflow: hidden;
  }

  #hexCanvas {
    display: block;
  }

  #confirmBtn {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 14px 28px;
    font-size: 20px;
    background: #004400;
    color: #aaffaa;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  #confirmBtn:disabled {
    background: #555;
    color: #999;
    cursor: not-allowed;
  }

  #actionBar {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 22px;
    background: #222;
    padding: 10px 20px;
    border-radius: 8px;
  }
</style>
</head>

<body>

<canvas id="hexCanvas"></canvas>
<div id="actionBar">Accions disponibles: <span id="actionCount">0</span></div>
<button id="confirmBtn">Confirmar ordres</button>

<script>
/* ----------------------------------------------------------
   CONFIGURACIÓ
---------------------------------------------------------- */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQXXXXX/pub?output=csv";

let actionsAvailable = 0;

/* ----------------------------------------------------------
   FUNCIÓ UNIVERSAL SENSE CACHE
---------------------------------------------------------- */
async function fetchNoCache(url) {
  const sep = url.includes("?") ? "&" : "?";
  const finalURL = url + sep + "cb=" + Date.now();

  const res = await fetch(finalURL, {
    cache: "no-store",
    headers: {
      "Cache-Control": "no-cache, no-store, must-revalidate",
      "Pragma": "no-cache",
      "Expires": "0"
    }
  });

  return res;
}

/* ----------------------------------------------------------
   FUNCIÓ QUE REFRESCA E2 I H2 CADA SEGON
---------------------------------------------------------- */
async function refreshExternalDocuments() {
  try {
    const csvRes = await fetchNoCache(CSV_URL);
    const csvText = await csvRes.text();

    const lines = csvText.trim().split("\n");
    if (lines.length < 2) return;

    const cols = lines[1].split(",");
    if (cols.length < 8) return;

    /* --- H2: Accions disponibles --- */
    const H2 = parseInt(cols[7]);
    if (!isNaN(H2)) {
      actionsAvailable = H2;
      updateActionDisplay();
    }

    /* --- E2: Bloqueig del botó --- */
    const E2 = cols[4].trim();
    const btn = document.getElementById("confirmBtn");

    if (E2 === "1") {
      btn.disabled = true;
      btn.style.background = "#555";
      btn.style.color = "#999";
      btn.style.cursor = "not-allowed";
    } else {
      btn.disabled = false;
      btn.style.background = "#004400";
      btn.style.color = "#aaffaa";
      btn.style.cursor = "pointer";
    }

  } catch (err) {
    console.error("Error refreshExternalDocuments:", err);
  }
}

/* ----------------------------------------------------------
   ACTUALITZAR BARRA D’ACCIONS
---------------------------------------------------------- */
function updateActionDisplay() {
  document.getElementById("actionCount").textContent = actionsAvailable;
}

/* ----------------------------------------------------------
   DIBUIX DEL MAPA HEXAGONAL (EL TEU CODI ORIGINAL)
---------------------------------------------------------- */
const canvas = document.getElementById("hexCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  drawHexGrid();
}

function drawHexGrid() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const hexSize = 40;
  const hexHeight = Math.sqrt(3) * hexSize;
  const cols = 20;
  const rows = 10;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = c * hexSize * 1.5 + 100;
      const y = r * hexHeight + (c % 2 ? hexHeight / 2 : 0) + 100;
      drawHex(x, y, hexSize);
    }
  }
}

function drawHex(x, y, size) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const angle = Math.PI / 3 * i;
    const px = x + size * Math.cos(angle);
    const py = y + size * Math.sin(angle);
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.strokeStyle = "#888";
  ctx.stroke();
}

/* ----------------------------------------------------------
   CONFIRMAR ORDRES
---------------------------------------------------------- */
document.getElementById("confirmBtn").addEventListener("click", () => {
  if (actionsAvailable <= 0) return;

  actionsAvailable--;
  updateActionDisplay();
});

/* ----------------------------------------------------------
   INICIALITZACIÓ
---------------------------------------------------------- */
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/* ----------------------------------------------------------
   REFRESC DINÀMIC CADA SEGON
---------------------------------------------------------- */
setInterval(refreshExternalDocuments, 1000);

</script>
</body>
</html>
