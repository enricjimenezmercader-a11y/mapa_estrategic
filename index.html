<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MAPA ESTRATÈGIC — Radar i Anàlisi</title>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      background:#05050a;
      color:#fff;
      font-family:Arial,Helvetica,sans-serif;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      padding-top:20px;
      gap:15px;
    }

    #titleBar{
      font-size:28px;
      font-weight:bold;
      text-align:center;
      letter-spacing:1px;
      text-shadow: 0 0 10px rgba(255,255,255,0.2);
    }

    #loadingIndicator {
      font-size: 13px;
      color: #888;
      font-family: monospace;
      min-height: 18px;
      text-align: center;
    }

    .territory-bar-container {
      width: 85%;
      max-width: 1000px;
      height: 20px;
      background: #111;
      border: 1px solid #334;
      border-radius: 10px;
      display: flex;
      overflow: hidden;
      margin-top: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }

    #redBarPart {
      height: 100%;
      background: #ff4444;
      width: 50%;
      transition: width 0.8s ease-in-out;
      border-right: 1px solid rgba(0,0,0,0.3);
    }

    #blueBarPart {
      height: 100%;
      background: #0078ff;
      width: 50%;
      transition: width 0.8s ease-in-out;
    }

    #turnIndicator {
      font-size: 21px;
      font-weight: bold;
      text-align: center;
      color: #ffffff;
      letter-spacing: 0.5px;
      margin-top: -5px;
      margin-bottom: 5px;
      text-shadow: 0 0 8px rgba(255,255,255,0.15);
    }

    #turnDate {
      font-style: italic;
      font-weight: normal;
      color: #ddd;
    }

    .main-layout {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 95%;
      max-width: 1400px;
      gap: 20px;
    }

    .team-panel {
      width: 220px;
      background: #101020;
      border: 2px solid #334;
      border-radius: 6px;
      padding: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-title {
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      padding-bottom: 6px;
      border-bottom: 1px solid #334;
      letter-spacing: 0.5px;
    }

    .panel-red { border-color: #ff4444; }
    .panel-red .panel-title { color: #ff5555; }
    
    .panel-blue { border-color: #0078ff; }
    .panel-blue .panel-title { color: #3399ff; }

    .stat-line {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #ccc;
    }

    .stat-value {
      font-weight: bold;
      color: #fff;
      font-family: monospace;
      font-size: 14px;
    }

    .map-container{
      position:relative;
      background:#111;
      border:2px solid #333;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      overflow:hidden;
    }

    .map-image{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:contain;
      z-index:1;
      pointer-events:none;
    }

    svg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      z-index:10;
      pointer-events:none;
    }

    .hex{ stroke:#000; stroke-width:2; }
    .hex-red{ fill:rgba(255,0,0,0.3); }
    .hex-blue{ fill:rgba(0,120,255,0.3); }
    .hex-mar{ fill:rgba(120,120,120,0.25); }

    .hex-label{
      fill:#fff; font-weight:bold; text-anchor:middle;
      stroke:#000; stroke-width:0.8; font-size:12px;
    }

    .attack-arrow{
      position:absolute; pointer-events:none; z-index:20;
      transform-origin:center center; opacity: 0.5;
    }

    .explosion-static { filter: drop-shadow(0 0 4px #ff5500); }
    .explosion-letter {
      fill: #000000; font-family: Arial, Helvetica, sans-serif;
      font-weight: 900; text-anchor: middle;
      dominant-baseline: central; pointer-events: none;
    }

    .watermark-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 25;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.35);
    }

    .watermark-text {
      font-size: 34px;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.28);
      text-transform: uppercase;
      letter-spacing: 2px;
      white-space: nowrap;
      transform: rotate(-35.54deg);
      user-select: none;
      border: 4px dashed rgba(255, 255, 255, 0.15);
      padding: 12px 40px;
      text-shadow: 0 0 15px rgba(0,0,0,0.6);
      width: 90%;
      text-align: center;
    }

    #battleButtonsContainer {
      width: 85%; max-width: 1000px;
      display: flex; flex-direction: column; gap: 10px;
      margin-top: 10px; padding-bottom: 5px;
    }

    .battle-btn {
      background: #151525; color: #fff; border: 1px solid #334;
      padding: 8px 14px; font-size: 12px; font-weight: bold;
      text-align: left; border-radius: 4px; cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .battle-btn:hover { background: #202035; border-color: #556; }
    .btn-contact { border-left: 4px solid #ff5555; }
    .btn-atdef { border-left: 4px solid #ffcc00; }

    /* Estils per al botó finalitzador i el seu efecte de brillantor */
    #endTurnContainer {
      width: 85%; max-width: 1000px;
      display: flex; justify-content: center;
      margin-top: 10px; padding-bottom: 40px;
    }

    .btn-end-turn {
      background: #008f44;
      color: #ffffff;
      border: 1px solid #00c853;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 200, 83, 0.2);
      animation: greenGlow 2s infinite alternate;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-end-turn:hover {
      background: #00aa51;
      transform: scale(1.02);
    }

    .btn-end-turn:active {
      transform: scale(0.98);
    }

    @keyframes greenGlow {
      0% {
        box-shadow: 0 0 12px rgba(0, 200, 83, 0.3), inset 0 0 6px rgba(0, 200, 83, 0.2);
      }
      100% {
        box-shadow: 0 0 24px rgba(0, 200, 83, 0.7), inset 0 0 12px rgba(0, 200, 83, 0.4);
      }
    }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(3px); z-index: 100;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }

    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-box {
      background: #101020; border: 2px solid #445; box-shadow: 0 0 25px rgba(0,0,0,0.7);
      width: 90%; max-width: 420px; border-radius: 6px; padding: 20px; position: relative;
    }

    .modal-title {
      font-size: 16px; font-weight: bold; margin-bottom: 15px;
      padding-bottom: 8px; border-bottom: 1px solid #334; color: #ffcc00;
    }

    .modal-close {
      position: absolute; top: 12px; right: 15px;
      background: none; border: none; color: #888;
      font-size: 18px; font-weight: bold; cursor: pointer;
    }
    .modal-close:hover { color: #fff; }

    .form-group { margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 13px; color: #ccc; }
    .form-group select {
      background: #1c1c30; color: #fff; border: 1px solid #445;
      padding: 8px; border-radius: 4px; font-size: 14px; outline: none; cursor: pointer;
    }

    .btn-resolve {
      background: #00aa55; color: #fff; border: none; padding: 10px;
      width: 100%; border-radius: 4px; font-weight: bold; font-size: 14px;
      cursor: pointer; margin-top: 10px; transition: background 0.2s;
    }
    .btn-resolve:hover { background: #00cc66; }
  </style>
</head>

<body>

<div id="titleBar">MAPA ESTRATÈGIC</div>
<div id="loadingIndicator">Sincronitzant dades amb el quarter general...</div>

<div class="territory-bar-container">
  <div id="redBarPart"></div>
  <div id="blueBarPart"></div>
</div>

<div id="turnIndicator">TORN - <span id="turnDate"></span></div>

<div class="main-layout">
  
  <div class="team-panel panel-red">
    <div class="panel-title">EQUIP VERMELL</div>
    <div class="stat-line">Accions: <span class="stat-value" id="v_accions">-</span></div>
    <div class="stat-line">Territoris: <span class="stat-value" id="v_territoris">-</span></div>
    <div class="stat-line">Unitats destruïdes: <span class="stat-value" id="v_destruides">-</span></div>
    <div class="stat-line">Unitats perdudes: <span class="stat-value" id="v_perdudes">-</span></div>
  </div>

  <div class="map-container" id="mapContainer">
    <div id="watermarkLayer"></div>
    <img class="map-image"
         src="https://github.com/enricjimenezmercader-a11y/mapa_estrategic/blob/481d1cc0765b31581a6f050a7f68d53400172e48/map_hex.jpg?raw=true"
         alt="Mapa estratègic">
    <svg id="hexGrid"></svg>
  </div>

  <div class="team-panel panel-blue">
    <div class="panel-title">EQUIP BLAU</div>
    <div class="stat-line">Accions: <span class="stat-value" id="b_accions">-</span></div>
    <div class="stat-line">Territoris: <span class="stat-value" id="b_territoris">-</span></div>
    <div class="stat-line">Unitats destruïdes: <span class="stat-value" id="b_destruides">-</span></div>
    <div class="stat-line">Unitats perdudes: <span class="stat-value" id="b_perdudes">-</span></div>
  </div>

</div>

<div id="battleButtonsContainer"></div>
<div id="endTurnContainer"></div>

<div class="modal-overlay" id="resolutionModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeResolutionModal()">×</button>
    <div class="modal-title" id="modalBattleTitle">Resolució de Batalla</div>
    
    <div class="form-group">
      <label for="lossesRed">Baixes bàndol vermell:</label>
      <select id="lossesRed"></select>
    </div>

    <div class="form-group">
      <label for="lossesBlue">Baixes bàndol blau:</label>
      <select id="lossesBlue"></select>
    </div>

    <div class="form-group">
      <label for="winnerSide">Vencedor:</label>
      <select id="winnerSide">
        <option value="Bàndol blau">Bàndol blau</option>
        <option value="Bàndol vermell">Bàndol vermell</option>
      </select>
    </div>

    <button class="btn-resolve" onclick="submitBattleResolution()">Resoldre</button>
  </div>
</div>

<script>
const PATTERN=[5,4,5,4,5,4,5,4,5,4,5];

const COLORS_JSON_URL="https://script.google.com/macros/s/AKfycbz0tCe6dKOavv4xVhvZoaVgv8TIkymvoj8NCYpE7U9jbqLGtmxw0eATLA2DXx50Cuk/exec";
const ORDERS_JSON_URL="https://script.google.com/macros/s/AKfycbzDdC4yHTVFzNdsSRJE7yfiRRvOiCPssSyVBEDPV92gSksgOnwfIVSUVVRkGSbzy_EBDw/exec";
const EXPLOSION_IMG_URL="https://github.com/enricjimenezmercader-a11y/mapa_estrategic/blob/894cd2a4b1d3605c654d4eaaa5862f5d90b6c2c4/explosion.png?raw=true";
const WEB_APP_RESOLVE_URL = "https://script.google.com/macros/s/AKfycbwaUU2qtxNhaa3a-xPX7IuPcu-Kh4xtEu7CogJ6AUYkVxN_9ziF4yNglZCVzFutzIEQnQ/exec";

const REAL_R=41.78;
const REAL_GRID_WIDTH=17*REAL_R;
const IMAGE_RATIO=1.4;

let hexData=[];
let arrowElements=[]; 
let activeBattleDetails = null;
let resolvedBattlesLog = [];

let vermellImpartit = false;
let blauImpartit = false;

let lastOrdersHash = "";
let lastWatermarkState = null; 

async function fetchJSONP(url){
  return new Promise((resolve, reject) => {
    const callbackName = 'jsonp_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
    const script = document.createElement('script');
    const timerId = setTimeout(() => { cleanup(); reject(new Error('Temps d\'espera esgotat')); }, 8000);
    function cleanup() { clearTimeout(timerId); if (window[callbackName]) delete window[callbackName]; if (script.parentNode) script.parentNode.removeChild(script); }
    window[callbackName] = function(data) { cleanup(); resolve(data); };
    const separator = url.includes('?') ? '&' : '?';
    script.src = url + separator + "callback=" + callbackName;
    script.onerror = function() { cleanup(); reject(new Error('Error de connexió')); };
    document.head.appendChild(script);
  });
}

function resizeMap(){
  const map=document.getElementById("mapContainer");
  const W=window.innerWidth; const H=window.innerHeight;
  const maxW=W*(0.65); const maxH=H*(0.70);
  let width=maxW; let height=width/IMAGE_RATIO;
  if(height>maxH){ height=maxH; width=height*IMAGE_RATIO; }
  map.style.width=width+"px"; map.style.height=height+"px";
}

function initHexGridStructure(){
  const svg=document.getElementById("hexGrid");
  const map=document.getElementById("mapContainer");
  svg.innerHTML=""; hexData=[];
  const B=map.clientWidth; const scale=B/REAL_GRID_WIDTH; const R=REAL_R*scale; const hexH=Math.sqrt(3)*R;
  const maxRows=Math.max(...PATTERN); const gridHeight=(maxRows-1)*hexH+hexH; const A=17*R;
  const offsetX=(B-A)/2+R; const offsetY=(map.clientHeight-gridHeight)/2+hexH/2;
  let id=1;

  PATTERN.forEach((rowCount,col)=>{
    for(let r=0;r<rowCount;r++){
      const cx=offsetX+col*1.5*R; const cy=offsetY+r*hexH+(col%2===0?0:hexH/2);
      const pts=[];
      for(let i=0;i<6;i++){ const ang=Math.PI/3*i; pts.push([cx+R*Math.cos(ang),cy+R*Math.sin(ang)].join(",")); }
      const g=document.createElementNS("http://www.w3.org/2000/svg","g");
      const poly=document.createElementNS("http://www.w3.org/2000/svg","polygon");
      poly.setAttribute("points",pts.join(" ")); poly.setAttribute("class","hex hex-mar"); poly.dataset.id=id;
      g.appendChild(poly);
      const label=document.createElementNS("http://www.w3.org/2000/svg","text");
      label.setAttribute("x",cx); label.setAttribute("y",cy+4); label.setAttribute("class","hex-label"); label.textContent=id;
      g.appendChild(label);
      svg.appendChild(g);
      hexData.push({id,cx,cy,color:"MAR",element:poly}); id++;
    }
  });
  const battleGroup = document.createElementNS("http://www.w3.org/2000/svg","g");
  battleGroup.id = "battleLayer"; svg.appendChild(battleGroup);
}

function populateSelectorOptions() {
  const reds = document.getElementById("lossesRed"); const blues = document.getElementById("lossesBlue");
  reds.innerHTML = ""; blues.innerHTML = "";
  for(let i = 0; i <= 10; i++) {
    const optR = document.createElement("option"); optR.value = i; optR.textContent = i; reds.appendChild(optR);
    const optB = document.createElement("option"); optB.value = i; optB.textContent = i; blues.appendChild(optB);
  }
}

function openResolutionModal(titleText, battleInfo) {
  document.getElementById("modalBattleTitle").textContent = titleText;
  document.getElementById("lossesRed").value = 0; document.getElementById("lossesBlue").value = 0;
  document.getElementById("winnerSide").selectedIndex = 0; activeBattleDetails = battleInfo;
  document.getElementById("resolutionModal").classList.add("active");
}

function closeResolutionModal() { document.getElementById("resolutionModal").classList.remove("active"); activeBattleDetails = null; }

function submitBattleResolution() {
  if (!activeBattleDetails) return;
  const rLoss = document.getElementById("lossesRed").value;
  const bLoss = document.getElementById("lossesBlue").value;
  const winner = document.getElementById("winnerSide").value;
  const battleLetter = activeBattleDetails.letter;
  let cotesImplicades = [];
  let uniqueBattleKey = "";
  if (activeBattleDetails.type === "contact") {
    cotesImplicades.push(activeBattleDetails.info.idA.toString(), activeBattleDetails.info.idB.toString());
    uniqueBattleKey = `contact-${activeBattleDetails.info.idA}-${activeBattleDetails.info.idB}`;
  } else if (activeBattleDetails.type === "atdef") {
    cotesImplicades.push(activeBattleDetails.targetId.toString());
    uniqueBattleKey = `atdef-${activeBattleDetails.targetId}`;
  }
  resolvedBattlesLog.push(uniqueBattleKey);
  const explosionGroup = document.getElementById(`expGroup-${battleLetter}`);
  if (explosionGroup) explosionGroup.remove();
  arrowElements = arrowElements.filter(arrow => {
    const origin = arrow.dataset.origin; const target = arrow.dataset.target;
    if (activeBattleDetails.type === "contact" && cotesImplicades.includes(origin) && cotesImplicades.includes(target)) { arrow.remove(); return false; }
    if (activeBattleDetails.type === "atdef" && target === activeBattleDetails.targetId.toString()) { arrow.remove(); return false; }
    return true; 
  });
  if(activeBattleDetails.btnElement) activeBattleDetails.btnElement.remove();

  lastOrdersHash = "";

  const callbackName = 'jsonp_save_' + Date.now();
  window[callbackName] = function(response) { delete window[callbackName]; const scr = document.getElementById(callbackName); if (scr) scr.remove(); };
  const finalUrl = WEB_APP_RESOLVE_URL + 
                   "?tipus=" + encodeURIComponent(activeBattleDetails.type) +
                   "&lletra=" + encodeURIComponent(battleLetter) +
                   "&descripcio=" + encodeURIComponent(document.getElementById("modalBattleTitle").textContent) +
                   "&baixes_vermell=" + encodeURIComponent(rLoss) +
                   "&baixes_blau=" + encodeURIComponent(bLoss) +
                   "&vencedor=" + encodeURIComponent(winner) +
                   "&cotes=" + encodeURIComponent(cotesImplicades.join("-")) +
                   "&callback=" + callbackName;
  const scriptInject = document.createElement("script"); scriptInject.id = callbackName; scriptInject.src = finalUrl; document.head.appendChild(scriptInject);
  closeResolutionModal();
}

function formatToCustomDate(rawString) {
  if (!rawString) return "";
  let cleanStr = rawString.split("T")[0]; 
  const parts = cleanStr.split("-");
  if (parts.length === 3 && parts[0].length === 4) {
    const year = parts[0]; const month = parts[1]; const day = parts[2];
    return `${day}/${month}/${year}`;
  }
  return rawString;
}

async function updateHexColors(){
  try {
    const rowsList = await fetchJSONP(COLORS_JSON_URL);
    if (Array.isArray(rowsList)) {
      let v_accions = "-", v_territoris = 0, baixes_vermell = 0;
      let b_accions = "-", b_territoris = 0, baixes_blaves = 0;
      let valorTorn = ""; let valorDia = "";

      vermellImpartit = false;
      blauImpartit = false;

      rowsList.forEach(row => {
        const rowIdAttr = parseInt(row["A"]);
        if (rowIdAttr === 6) valorTorn = row["O"] !== undefined ? row["O"].toString().trim() : "";
        if (rowIdAttr === 8) valorDia = row["O"] !== undefined ? row["O"].toString().trim() : "";

        const id = parseInt(row["A"]); 
        if (!isNaN(id)) {
          const color = (row["B"] || "MAR").trim().toUpperCase();
          const hex = hexData.find(h => h.id === id);
          if(hex) {
            hex.color = color; let cls = "hex hex-mar";
            if(color === "RED") cls = "hex hex-red"; else if(color === "BLUE") cls = "hex hex-blue";
            hex.element.setAttribute("class", cls);
          }
        }
        
        const kText = row["K"] ? row["K"].toString().toLowerCase().trim() : "";

        if (kText.includes("inicials vermell")) {
          v_accions = row["H"] !== undefined ? row["H"] : v_accions;
          if(parseInt(row["E"]) === 1) vermellImpartit = true;
        }
        if (kText.includes("inicials blau")) {
          b_accions = row["H"] !== undefined ? row["H"] : b_accions;
          if(parseInt(row["E"]) === 1) blauImpartit = true;
        }

        if (kText.includes("territori vermell")) v_territoris = parseInt(row["L"]) || 0;
        if (kText.includes("territori blau")) b_territoris = parseInt(row["L"]) || 0;


// Lectura directa segons l'estructura de la imatge:
if (kText.includes("baixes v")) {
    baixes_vermell = parseInt(row["L"]) || 0;
    baixes_blaves = parseInt(row["M"]) || 0;
}
      });

      if(valorTorn) {
        document.getElementById("turnIndicator").firstChild.textContent = `TORN ${valorTorn} - `;
        document.getElementById("turnDate").textContent = formatToCustomDate(valorDia);
      } else {
        document.getElementById("turnIndicator").firstChild.textContent = `TORN - `;
        document.getElementById("turnDate").textContent = "";
      }

      document.getElementById("v_accions").textContent = v_accions;
      document.getElementById("v_territoris").textContent = v_territoris;
      document.getElementById("v_destruides").textContent = baixes_blaves;  
      document.getElementById("v_perdudes").textContent = baixes_vermell;   

      document.getElementById("b_accions").textContent = b_accions;
      document.getElementById("b_territoris").textContent = b_territoris;
      document.getElementById("b_destruides").textContent = baixes_vermell; 
      document.getElementById("b_perdudes").textContent = baixes_blaves;    

      const totalT = v_territoris + b_territoris;
      if (totalT > 0) {
        const redPct = (v_territoris / totalT) * 100;
        document.getElementById("redBarPart").style.width = redPct + "%";
        document.getElementById("blueBarPart").style.width = (100 - redPct) + "%";
      } else {
        document.getElementById("redBarPart").style.width = "50%";
        document.getElementById("blueBarPart").style.width = "50%";
      }
    }
  } catch(e) { console.log("Error de sincronització de dades:", e.message); }
}

async function updateActiveOrders(){
  try {
    await updateHexColors();

    const watermarkLayer = document.getElementById("watermarkLayer");
    const btnContainer = document.getElementById("battleButtonsContainer"); 
    const endTurnContainer = document.getElementById("endTurnContainer");
    const battleLayer = document.getElementById("battleLayer");

    if (!vermellImpartit || !blauImpartit) {
      if (lastWatermarkState !== "waiting") {
        arrowElements.forEach(img => img.remove()); arrowElements = [];
        if(battleLayer) battleLayer.innerHTML = "";
        btnContainer.innerHTML = "";
        endTurnContainer.innerHTML = "";
        
        watermarkLayer.innerHTML = "";
        const overlay = document.createElement("div");
        overlay.className = "watermark-overlay";
        const textSpan = document.createElement("div");
        textSpan.className = "watermark-text";
        textSpan.textContent = "Esperant ordres dels equips";
        overlay.appendChild(textSpan);
        watermarkLayer.appendChild(overlay);
        
        lastWatermarkState = "waiting";
        lastOrdersHash = ""; 
      }
      
      const d = new Date();
      document.getElementById("loadingIndicator").textContent = `Radar latent (esperant ordres creuades): ${d.toLocaleTimeString()}`;
      return; 
    }

    const orderStrings = await fetchJSONP(ORDERS_JSON_URL);
    if (Array.isArray(orderStrings)) {
      
      const currentHash = JSON.stringify(orderStrings) + "_" + JSON.stringify(resolvedBattlesLog);

      if (currentHash === lastOrdersHash && lastWatermarkState === "active") {
        const d = new Date(); 
        document.getElementById("loadingIndicator").textContent = `Radar analitzat correctament (Sense canvis): ${d.toLocaleTimeString()}`;
        return; 
      }

      lastOrdersHash = currentHash;
      lastWatermarkState = "active";

      watermarkLayer.innerHTML = "";
      arrowElements.forEach(img => img.remove()); arrowElements = [];
      if(battleLayer) battleLayer.innerHTML = "";
      btnContainer.innerHTML = "";
      endTurnContainer.innerHTML = "";

      let activeOrders = [];
      orderStrings.forEach(orderText => {
        const match = orderText.match(/territori\s+(\d+)\s+a\s+territori\s+(\d+)/i);
        if (match) {
          const originID = parseInt(match[1]); const targetID = parseInt(match[2]);
          const originHex = hexData.find(h => h.id === originID); const targetHex = hexData.find(h => h.id === targetID);
          if (originHex && targetHex) activeOrders.push({ originID, targetID, originHex, targetHex, processed: false });
        }
      });

      let contactBattles = []; let attackDefenseTargets = new Set();
      for (let i = 0; i < activeOrders.length; i++) {
        if (activeOrders[i].processed) continue;
        for (let j = i + 1; j < activeOrders.length; j++) {
          if (activeOrders[j].processed) continue;
          if (activeOrders[i].originID === activeOrders[j].targetID && activeOrders[i].targetID === activeOrders[j].originID) {
            activeOrders[i].processed = true; activeOrders[j].processed = true;
            const key = `contact-${activeOrders[i].originID}-${activeOrders[i].targetID}`;
            const keyInverse = `contact-${activeOrders[i].targetID}-${activeOrders[i].originID}`;
            if (!resolvedBattlesLog.includes(key) && !resolvedBattlesLog.includes(keyInverse)) {
              contactBattles.push({ hexA: activeOrders[i].originHex, hexB: activeOrders[i].targetHex, idA: activeOrders[i].originID, idB: activeOrders[i].targetID });
            }
            break;
          }
        }
      }

      activeOrders.forEach(order => { if (!order.processed) { const key = `atdef-${order.targetID}`; if (!resolvedBattlesLog.includes(key)) attackDefenseTargets.add(order.targetID); } });
      activeOrders.forEach(order => {
        const contactKey = `contact-${order.originID}-${order.targetID}`; const contactKeyInverse = `contact-${order.targetID}-${order.originID}`; const atdefKey = `atdef-${order.targetID}`;
        let isResolved = resolvedBattlesLog.includes(atdefKey) || resolvedBattlesLog.includes(contactKey) || resolvedBattlesLog.includes(contactKeyInverse);
        if (!isResolved) placeInformativeArrow(order.originHex, order.targetHex);
      });

      buildTacticalInterface(contactBattles, Array.from(attackDefenseTargets));
      
      const d = new Date(); 
      document.getElementById("loadingIndicator").textContent = `Radar analitzat correctament: ${d.toLocaleTimeString()}`;
    }
  } catch(e) { document.getElementById("loadingIndicator").textContent = `⚠️ Error analitzador: ${e.message}`; }
}

function buildTacticalInterface(contacts, atDefs) {
  const btnContainer = document.getElementById("battleButtonsContainer"); const layer = document.getElementById("battleLayer");
  const endTurnContainer = document.getElementById("endTurnContainer");
  
  btnContainer.innerHTML = ""; if(layer) layer.innerHTML = "";
  endTurnContainer.innerHTML = "";

  const map = document.getElementById("mapContainer"); const scale = map.clientWidth / REAL_GRID_WIDTH; const R = REAL_R * scale; const explosionSize = R * 1.5; 
  let letterIndex = 0; function getLetter(index) { return String.fromCharCode(65 + index); }
  
  contacts.forEach(c => {
    const letter = getLetter(letterIndex++); const mx = (c.hexA.cx + c.hexB.cx) / 2; const my = (c.hexA.cy + c.hexB.cy) / 2;
    createSvgExplosionWithLetter(layer, mx, my, explosionSize, letter);
    const btn = document.createElement("button"); btn.className = "battle-btn btn-contact";
    const btnText = `(${letter}) Batalla de contacte entre cota ${c.idA} i ${c.idB}`; btn.textContent = btnText;
    btn.onclick = () => openResolutionModal(btnText, { type: "contact", info: c, letter: letter, btnElement: btn });
    btnContainer.appendChild(btn);
  });
  
  atDefs.forEach(targetId => {
    const hex = hexData.find(h => h.id === targetId);
    if(hex) {
      const letter = getLetter(letterIndex++); createSvgExplosionWithLetter(layer, hex.cx, hex.cy, explosionSize, letter);
      const btn = document.createElement("button"); btn.className = "battle-btn btn-atdef";
      const btnText = `(${letter}) Assalt atac-defensa a cota ${targetId}`; btn.textContent = btnText;
      btn.onclick = () => openResolutionModal(btnText, { type: "atdef", targetId: targetId, letter: letter, btnElement: btn });
      btnContainer.appendChild(btn);
    }
  });

  // VERIFICACIÓ FINAL: Si els dos equips han jugat i no queden botons de combat pendents de resoldre
  if (vermellImpartit && blauImpartit && btnContainer.children.length === 0) {
    const endTurnBtn = document.createElement("button");
    endTurnBtn.className = "btn-end-turn";
    endTurnBtn.id = "btnEndTurn";
    endTurnBtn.textContent = "Finalitzar torn";
    endTurnBtn.onclick = () => handleEndTurnClick();
    endTurnContainer.appendChild(endTurnBtn);
  }
}

function handleEndTurnClick() {
  console.log("Botó 'Finalitzar torn' polsat. Esperant definició de funcions...");
  // Aquí aniran les teves noves funcions
}

function createSvgExplosionWithLetter(parent, x, y, size, letter) {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g"); g.id = `expGroup-${letter}`;
  const img = document.createElementNS("http://www.w3.org/2000/svg", "image");
  img.setAttributeNS("http://www.w3.org/1999/xlink", "href", EXPLOSION_IMG_URL);
  img.setAttribute("x", x - (size / 2)); img.setAttribute("y", y - (size / 2)); img.setAttribute("width", size); img.setAttribute("height", size); img.setAttribute("class", "explosion-static");
  g.appendChild(img);
  const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
  text.setAttribute("x", x); text.setAttribute("y", y); text.setAttribute("class", "explosion-letter"); text.setAttribute("font-size", `${size * 0.245}px`); text.textContent = letter;
  g.appendChild(text); parent.appendChild(g);
}

function direction(origin,target){
  const dx=target.cx-origin.cx; const dy=target.cy-origin.cy;
  if(dy<0 && Math.abs(dx)<Math.abs(dy)) return "N"; if(dy>0 && Math.abs(dx)<Math.abs(dy)) return "S";
  if(dx>0 && dy<0) return "NE"; if(dx>0 && dy>0) return "SE"; if(dx<0 && dy<0) return "NO"; if(dx<0 && dy>0) return "SO";
  return "N";
}

function arrowURL(dir){
  return {
    "N":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-N.svg",
    "NE":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-NE.svg",
    "NO":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-NO.svg",
    "S":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-S.svg",
    "SE":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-SE.svg",
    "SO":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-SO.svg"
  }[dir];
}

function placeInformativeArrow(origin,target){
  const map=document.getElementById("mapContainer");
  const B=map.clientWidth; const scale=B/REAL_GRID_WIDTH; const R=REAL_R*scale; const hexH=Math.sqrt(3)*R;
  const dir=direction(origin,target); const url=arrowURL(dir);
  const img=document.createElement("img"); img.src=url; img.className="attack-arrow"; 
  img.dataset.origin = origin.id; img.dataset.target = target.id;
  const FACTOR=1.42; const width = 2 * R * FACTOR; const height = hexH * FACTOR;
  img.style.width = width + "px"; img.style.height = height + "px";
  img.style.left = (origin.cx - width/2) + "px"; img.style.top = (origin.cy - height/2) + "px";
  map.appendChild(img); arrowElements.push(img);
}

async function syncRadarData(){ await updateActiveOrders(); }
function fullRedraw(){ 
  lastOrdersHash = ""; 
  resizeMap(); 
  initHexGridStructure(); 
  syncRadarData(); 
}
window.addEventListener("resize", fullRedraw);
populateSelectorOptions(); resizeMap(); initHexGridStructure();
setTimeout(syncRadarData, 500); setInterval(syncRadarData, 5000);
