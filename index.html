<!doctype html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Mapa Estratègic — Retícula Hexagonal</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%}
        body{ background:#000; color:#fff; font-family:Arial,Helvetica,sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:20px; gap:20px; }
        #titleBar{ font-size:28px; font-weight:bold; text-align:center; }
        #actionBar{ width:66%; height:20px; background:#333; border:1px solid #666; margin-top:-10px; margin-bottom:10px; position:relative; }
        #actionFill{ height:100%; background:#00cc00; width:0%; transition:width 0.3s ease; }
        .map-container{ position:relative; background:#1a1a1a; border:1px solid #333; overflow:hidden; }
        .map-image{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; z-index:1; pointer-events:none; }
        svg{ position:absolute; inset:0; width:100%; height:100%; z-index:10; }
        .hex{ stroke:#000; stroke-width:2; cursor:pointer; }
        .hex-red{ fill:rgba(255,0,0,0.33); }
        .hex-blue{ fill:rgba(0,120,255,0.33); }
        .hex-mar{ fill:rgba(120,120,120,0.33); }
        .hex-hatch{ fill:url(#hatch-red); }
        .hex-label{ fill:#fff; font-weight:bold; text-anchor:middle; pointer-events:none; stroke:#000; stroke-width:0.8; }
        #orders{ width:66%; color:#7CFF7C; font-family:monospace; font-size:18px; white-space:pre-line; min-height:40px; }
        .order-line{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
        .order-btn{ background:#550000; color:#fff; border:1px solid #aa0000; padding:3px 8px; cursor:pointer; font-size:14px; }
        #confirmBtn{ margin-top:10px; padding:6px 12px; background:#004400; color:#aaffaa; border:1px solid #66ff66; cursor:pointer; font-size:16px; display:block; }
        #warning, #warningActions{ position:absolute; top:10px; left:50%; transform:translateX(-50%); font-size:40px; font-weight:bold; color:#FF4444; text-shadow:0 0 10px #000; opacity:0; pointer-events:none; z-index:999; }
        .blink{ animation: blinkAnim 0.3s linear infinite; }
        @keyframes blinkAnim{ 0%{opacity:1;} 50%{opacity:0;} 100%{opacity:1;} }
        .attack-arrow{ position:absolute; pointer-events:none; z-index:20; transform-origin:center center; }
        @keyframes shake { 0% { transform: translate(0,0); } 25% { transform: translate(1px,-1px); } 50% { transform: translate(-1px,1px); } 75% { transform: translate(1px,1px); } 100% { transform: translate(0,0); } }
        .attack-arrow--shake{ animation:shake 0.25s linear 1; }
        @keyframes glow { 0% { filter: drop-shadow(0 0 0px #fff); } 50% { filter: drop-shadow(0 0 12px #ffff66); } 100% { filter: drop-shadow(0 0 0px #fff); } }
        .attack-arrow--glow{ animation:glow 1.4s ease-in-out infinite; }
    </style>
</head>
<body>

    <div id="titleBar">Equip vermell — Accions disponibles: ...</div>
    <div id="actionBar"><div id="actionFill"></div></div>

    <div class="map-container" id="mapContainer">
        <img src="https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/mapa_fons.png" class="map-image">
        <svg id="hexGrid"></svg>
        <div id="warning">Ordre repetida</div>
        <div id="warningActions">Accions insuficients</div>
    </div>

    <div id="orders"></div>
    <button id="confirmBtn">Confirmar ordres</button>

    <audio id="moveSound" src="https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/mov.mp3"></audio>
    <audio id="ordersSound" src="https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/orders.mp3"></audio>

<script>
    // --- CONFIGURACIÓ ORIGINAL ---
    const PATTERN=[2, 3];
    const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vS8k769FG5aF_PK-AmHLVdcfc6sgJeeIhWkL9Q8Gcrs39JW9GyJid_OtHcwhN9r3xhFvWPrc_yigZiY/pub?output=csv";
    const REAL_R=41.78;
    const REAL_GRID_WIDTH=17 * REAL_R;
    const IMAGE_RATIO=1.4;

    let hexData=[];
    let selectedRed=null;
    let highlightedAdjacents=[];
    let ordersSet=new Set();
    let actionsAvailable=0;
    let arrowImages={};
    let clickLocked=false;
    
    // --- NOVA LÒGICA DE SINCRONITZACIÓ --- [4]
    let lastCSVData = null;

    async function fetchCSV() {
        const res = await fetch(CSV_URL + "&cb=" + Date.now(), { cache: "no-store" });
        return await res.text();
    }

    async function syncData() {
        try {
            const currentText = await fetchCSV();
            
            // 1. SEMPRE comprovem el bloqueig E1 (Fila 1, Columna 5)
            const lines = currentText.trim().split("\n");
            const firstLineCols = lines.split(",");
            const E1 = firstLineCols[3] ? firstLineCols[3].trim() : "0";
            updateConfirmButtonState(E1);

            // 2. Si les dades NO han canviat, no redibuixem el mapa
            if (currentText === lastCSVData) return;
            
            console.log("Canvis detectats al Sheet. Actualitzant mapa...");
            lastCSVData = currentText;

            // 3. Processar colors i accions (H2 està a Fila 2, Columna 8)
            const colors = {};
            let H2 = 0;
            lines.forEach((line, index) => {
                const cols = line.split(",");
                if (index === 1) H2 = parseInt(cols[4]) || 0;
                const id = cols;
                const color = cols[5];
                if (id) colors[id.trim()] = (color || "").trim().toUpperCase();
            });

            actionsAvailable = H2;
            
            // 4. Redibuixar mapa mantenint funcionalitat original
            await drawHexGrid(colors);
            updateActionDisplay();

        } catch (err) {
            console.error("Error de sincronització:", err);
        }
    }

    function updateConfirmButtonState(E1) {
        const btn = document.getElementById("confirmBtn");
        btn._sheetLocked = (E1 === "1");
        if (btn._sheetLocked || btn._tempLocked) {
            btn.disabled = true;
            btn.style.background = "#555";
            btn.style.color = "#999";
            btn.style.cursor = "not-allowed";
        } else {
            btn.disabled = false;
            btn.style.background = "#004400";
            btn.style.color = "#aaffaa";
            btn.style.cursor = "pointer";
        }
    }

    // --- FUNCIONS DE DIBUIX I INTERACCIÓ (Originals de les línies 262-639) --- [6-8]

    async function drawHexGrid(colors) {
        const svg=document.getElementById("hexGrid");
        const map=document.getElementById("mapContainer");
        svg.innerHTML="";
        hexData=[];
        selectedRed=null;
        highlightedAdjacents=[];
        arrowImages={};
        ordersSet=new Set();
        document.getElementById("orders").innerHTML="";

        svg.insertAdjacentHTML("afterbegin",`<defs>
            <pattern id="hatch-red" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
                <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(255,0,0,0.5)" stroke-width="3"/>
            </pattern>
        </defs>`);

        const B=map.clientWidth;
        const scale=B/REAL_GRID_WIDTH;
        const R=REAL_R* scale;
        const hexH=Math.sqrt(3) *R;
        const maxRows=Math.max(...PATTERN);
        const gridHeight=(maxRows-1)*hexH+hexH;
        const A=17*R;
        const offsetX=(B-A)/2+R;
        const offsetY=(map.clientHeight-gridHeight)/2+hexH/2;

        let id=1;
        PATTERN.forEach((rowCount,col)=>{
            for(let r=0;r<rowCount;r++){
                const cx=offsetX+col* 1.5 *R;
                const cy=offsetY+r* hexH+(col%2===0?0:hexH/2);
                const pts=[];
                for(let i=0;i<6;i++){
                    const ang=Math.PI/3 *i;
                    pts.push([cx+R* Math.cos(ang),cy+R* Math.sin(ang)].join(","));
                }
                
                const g=document.createElementNS("http://www.w3.org/2000/svg","g");
                const poly=document.createElementNS("http://www.w3.org/2000/svg","polygon");
                poly.setAttribute("points",pts.join(" "));
                
                const color=(colors[id]||"").toUpperCase();
                let cls="hex hex-mar";
                if(color.includes("RED")) cls="hex hex-red";
                else if(color.includes("BLUE")) cls="hex hex-blue";
                
                poly.setAttribute("class",cls);
                poly.dataset.id=id;
                g.appendChild(poly);
                
                const label=document.createElementNS("http://www.w3.org/2000/svg","text");
                label.setAttribute("x",cx); label.setAttribute("y",cy+4);
                label.setAttribute("class","hex-label");
                label.textContent=id;
                g.appendChild(label);
                
                svg.appendChild(g);
                hexData.push({id,cx,cy,color,element:poly});
                id++;
            }
        });
    }

    function updateActionDisplay(){
        const spent=usedPoints();
        const remaining=actionsAvailable-spent;
        document.getElementById("titleBar").textContent= `Equip vermell — Accions disponibles: ${actionsAvailable} — Gastades: ${spent} — Restants: ${remaining}`;
        const pct=Math.min(100,(spent/actionsAvailable) *100);
        document.getElementById("actionFill").style.width=pct+"%";
    }

    function usedPoints(){ return ordersSet.size * 10; }

    function highlightAdjacent(redHex){
        clearHighlights();
        selectedRed=redHex;
        const R=REAL_R*(document.getElementById("mapContainer").clientWidth/REAL_GRID_WIDTH);
        const maxDist=Math.sqrt(3)*R*1.01;
        highlightedAdjacents=[];
        hexData.forEach(h=>{
            if(h.color==="BLUE"){
                const dx=h.cx-redHex.cx; const dy=h.cy-redHex.cy;
                const dist=Math.sqrt(dx*dx+dy*dy);
                if(dist<=maxDist){
                    h.element.classList.add("hex-hatch");
                    highlightedAdjacents.push(h);
                }
            }
        });
    }

    function clearHighlights(){
        highlightedAdjacents.forEach(h=>h.element.classList.remove("hex-hatch"));
        highlightedAdjacents=[];
        selectedRed=null;
    }

    function showWarning(){
        const w=document.getElementById("warning");
        w.classList.add("blink"); w.style.opacity=1;
        setTimeout(()=>{w.style.opacity=0;w.classList.remove("blink");},2000);
    }

    function showWarningActions(){
        const w=document.getElementById("warningActions");
        w.classList.add("blink"); w.style.opacity=1;
        setTimeout(()=>{w.style.opacity=0;w.classList.remove("blink");},2000);
    }

    function direction(origin,target){
        const dx=target.cx-origin.cx; const dy=target.cy-origin.cy;
        if(dy<0 && Math.abs(dx)<Math.abs(dy)) return "N";
        if(dy>0 && Math.abs(dx)<Math.abs(dy)) return "S";
        if(dx>0 && dy<0) return "NE";
        if(dx>0 && dy>0) return "SE";
        if(dx<0 && dy<0) return "NO";
        if(dx<0 && dy>0) return "SO";
        return "N";
    }

    function arrowURL(dir){
        return {
            "N":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-N.svg",
            "NE":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-NE.svg",
            "NO":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-NO.svg",
            "S":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-S.svg",
            "SE":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-SE.svg",
            "SO":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-SO.svg"
        }[dir];
    }

    function placeArrow(origin,target,key){
        const map=document.getElementById("mapContainer");
        const B=map.clientWidth;
        const R=REAL_R*(B/REAL_GRID_WIDTH);
        const hexH=Math.sqrt(3)*R;
        const dir=direction(origin,target);
        const img=document.createElement("img");
        img.src=arrowURL(dir);
        img.className="attack-arrow attack-arrow--shake attack-arrow--glow";
        const FACTOR=1.42;
        const width = 2 * R * FACTOR;
        const height = hexH * FACTOR;
        img.style.width = width + "px"; img.style.height = height + "px";
        img.style.left = (origin.cx - width/2) + "px"; img.style.top = (origin.cy - height/2) + "px";
        map.appendChild(img);
        arrowImages[key]=img;
        setTimeout(()=>{ if(img) img.classList.remove("attack-arrow--shake"); },260);
    }

    function removeArrow(key){
        if(arrowImages[key]){ arrowImages[key].remove(); delete arrowImages[key]; }
    }

    function addOrder(originID,targetID){
        const key=`${originID}-${targetID}`;
        if(ordersSet.has(key)){ showWarning(); return; }
        if((actionsAvailable - usedPoints()) < 10){ showWarningActions(); return; }
        
        ordersSet.add(key);
        clickLocked = true; document.body.style.cursor = "wait";
        setTimeout(() => { clickLocked = false; document.body.style.cursor = "default"; }, 1000);
        
        const origin=hexData.find(h=>h.id===originID);
        const target=hexData.find(h=>h.id===targetID);
        placeArrow(origin,target,key);
        target.element.classList.remove("hex-hatch");
        document.getElementById("moveSound").play();
        
        const orders=document.getElementById("orders");
        const line=document.createElement("div");
        line.className="order-line";
        const text=document.createElement("span");
        text.textContent=`Ordre d'atac, territori ${originID} a territori ${targetID}`;
        const btn=document.createElement("button");
        btn.textContent="Suspendre ordre"; btn.className="order-btn";
        btn.onclick=()=>{ ordersSet.delete(key); removeArrow(key); line.remove(); updateActionDisplay(); };
        line.appendChild(text); line.appendChild(btn);
        orders.appendChild(line);
        updateActionDisplay();
    }

    function setupClickHandler(){
        const svg=document.getElementById("hexGrid");
        svg.onclick = (e) => {
            if (clickLocked) return;
            const poly=e.target.closest("polygon");
            if(!poly){ clearHighlights(); return; }
            const id=parseInt(poly.dataset.id);
            const hex=hexData.find(h=>h.id===id);
            if(hex.color==="RED"){ highlightAdjacent(hex); return; }
            if(selectedRed && highlightedAdjacents.some(h=>h.id===id)){
                addOrder(selectedRed.id,hex.id);
                return;
            }
            clearHighlights();
        };
    }

    function resizeMap(){
        const map=document.getElementById("mapContainer");
        const maxW=window.innerWidth*(2/3); const maxH=window.innerHeight*(2/3);
        let width=maxW; let height=width/IMAGE_RATIO;
        if(height>maxH){ height=maxH; width=height*IMAGE_RATIO; }
        map.style.width=width+"px"; map.style.height=height+"px";
    }

    // --- INICIALITZACIÓ ---
    window.onresize = () => { resizeMap(); lastCSVData = null; syncData(); };
    
    resizeMap();
    syncData().then(() => setupClickHandler());
    
    // Bucle d'actualització dinàmica cada 3 segons
    setInterval(syncData, 3000);

    // Gestió del botó Confirmar (Original)
    document.getElementById("confirmBtn").onclick = async () => {
        const btn = document.getElementById("confirmBtn");
        if (btn._sheetLocked || btn._tempLocked) return;
        
        btn._tempLocked = true; btn.disabled = true;
        btn.style.background = "#555"; document.body.style.cursor = "wait";
        
        setTimeout(() => { btn._tempLocked = false; document.body.style.cursor = "default"; syncData(); }, 5000);
        document.getElementById("ordersSound").play();
        
        const url = "https://script.google.com/macros/s/AKfycbzMGXDTpJXy2jGjGxPT5g27kOntPOEj6aO-ap_8KIPqi1iyR-FQknxpNva-QqqTXxt/exec";
        const lines = document.querySelectorAll(".order-line");
        for (const line of lines) {
            const text = line.querySelector("span").textContent;
            await fetch(url, { method: "POST", mode: "no-cors", body: JSON.stringify({ orderText: text }) });
            await new Promise(res => setTimeout(res, 150));
        }
    };
</script>
</body>
</html>
