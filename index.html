<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Estratègic</title>
    <style>
        body {
            background-color: #222;
            color: #aaa;
            font-family: sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #mapContainer {
            position: relative;
            width: 80%;
            height: 80%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #hexGrid {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .hex {
            stroke: #444;
            stroke-width: 1;
            transition: fill 0.2s ease-in-out;
            cursor: pointer;
        }

        .hex-mar { fill: #333; }
        .hex-red { fill: #800000; }
        .hex-blue { fill: #000080; }
        .hex-hatch { fill: url(#hatch-red); }

        .hex-label {
            font-size: 10px;
            fill: #fff;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
            user-select: none;
        }

        #titleBar {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 1.2em;
            font-weight: bold;
            color: #00cc00;
        }

        #actionFillContainer {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 200px;
            height: 20px;
            background-color: #444;
            border: 1px solid #888;
            overflow: hidden;
        }

        #actionFill {
            height: 100%;
            background-color: #008800;
            transition: width 0.5s ease-in-out;
        }

        #orders {
            position: absolute;
            top: 50px;
            right: 10px;
            width: 250px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            background-color: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
        }

        .order-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            padding: 5px;
            background-color: #333;
            border-radius: 3px;
        }

        .order-btn {
            background-color: #800000;
            color: #fff;
            border: none;
            padding: 3px 8px;
            border-radius: 3px;
            cursor: pointer;
        }

        .order-btn:hover {
            background-color: #cc0000;
        }

        #confirmBtn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            padding: 10px 20px;
            font-size: 1.2em;
            background-color: #004400;
            color: #aaffaa;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        #confirmBtn:disabled {
            background-color: #555 !important;
            color: #999 !important;
            cursor: not-allowed !important;
        }

        #warning, #warningActions {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            pointer-events: none;
            z-index: 10;
        }

        .blink {
            animation: blink 0.5s linear infinite alternate;
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.5; }
        }

        .attack-arrow {
            position: absolute;
            pointer-events: none;
            transform-origin: center center;
            transition: transform 0.2s ease-out, opacity 0.2s ease-out;
        }

        .attack-arrow--shake {
            transform: scale(1.2);
        }

        .attack-arrow--glow {
            filter: drop-shadow(0 0 10px rgba(255,165,0,0.8));
        }
    </style>
</head>
<body>
    <div id="mapContainer">
        <svg id="hexGrid"></svg>
        <div id="titleBar">Equip vermell — Accions disponibles: 0</div>
        <div id="actionFillContainer">
            <div id="actionFill"></div>
        </div>
        <button id="confirmBtn">Confirmar ordres</button>
    </div>
    <div id="orders"></div>
    <div id="warning">Acció no vàlida!</div>
    <div id="warningActions">No hi ha prou accions!</div>

    <audio id="moveSound" src="https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/move.wav"></audio>
    <audio id="ordersSound" src="https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/orders.wav"></audio>

    <script>
        // --- CONSTANTS ---
        const IMAGE_RATIO = 1.7777777777777777; // Width / Height
        const REAL_GRID_WIDTH = 25.5;
        const REAL_R = 1.5; // Radius of hexagon in map units

        // Hex grid pattern (number of hexes per column)
        const PATTERN = [3, 4, 5, 4, 3];

        // --- VARIABLES GLOBALS ---
        let hexData = [];
        let selectedRed = null;
        let highlightedAdjacents = [];
        let arrowImages = {};
        let ordersSet = new Set();
        let actionsAvailable = 0; // Will be loaded from CSV
        let clickLocked = false;

        // --- FUNCIONS ---

        async function fetchCSV() {
            // Replace with your actual Google Apps Script URL
            const url = "https://script.google.com/macros/s/AKfycbzMGXDTpJXy2jGjGxPT5g27kOntPOEj6aO-ap_8KIPqi1iyR-FQknxpNva-QqqTXxt_/exec";
            try {
                const response = await fetch(url, { cache: "no-store" }); // Fetch without caching
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return await response.text();
            } catch (err) {
                console.error("Error fetching CSV:", err);
                // Return a default structure or re-throw to handle it elsewhere
                return "0,BLUE,,\n,,\n1,RED,,,"; // Example default structure if fetch fails
            }
        }


        async function loadCSV(){
            const text = await fetchCSV();
            const lines = text.trim().split("\n");

            const colors = {};
            let H2 = 0; // Variable to store the actions available from H2

            lines.forEach((line, index) => {
                const cols = line.split(",");
                // Assuming H2 is in the second row, 8th column (index 7)
                if (index === 1) {
                    H2 = parseInt(cols[7]);
                    if (isNaN(H2)) {
                        H2 = 0; // Default to 0 if parsing fails
                    }
                }
                const id = cols[0];
                const color = cols[1];
                if (id) colors[id.trim()] = color.trim().toUpperCase();
            });

            actionsAvailable = H2; // Directly assign H2 to actionsAvailable
            updateActionDisplay(); // Update the display immediately
            return colors;
        }

        setInterval(fetchCSV, 1000);
        // Initial fetch of CSV data when the script loads
        loadCSV();

        // ------------------------------
        // BLOQUEIG DINÀMIC PER E1
        // ------------------------------
        async function checkLockState() {
            try {
                const text = await fetchCSV();
                const lines = text.trim().split("\n");
                const cols = lines[0].split(",");
                const E1 = cols[4].trim(); // Assuming E1 is in the first row, 5th column (index 4)

                const btn = document.getElementById("confirmBtn");

                btn._sheetLocked = (E1 === "1");

                if (btn._sheetLocked || btn._tempLocked) {
                    btn.disabled = true;
                    btn.style.background = "#555";
                    btn.style.color = "#999";
                    btn.style.cursor = "not-allowed";
                } else {
                    btn.disabled = false;
                    btn.style.background = "#004400";
                    btn.style.color = "#aaffaa";
                    btn.style.cursor = "pointer";
                }

            } catch (err) {
                console.log("Error checkLockState:", err);
            }
        }

        setInterval(checkLockState, 1000);

        // ------------------------------

        // MODIFICACIÓ: Només mostra les accions disponibles del CSV
        function updateActionDisplay(){
          document.getElementById("titleBar").textContent =
            `Equip vermell — Accions disponibles: ${actionsAvailable}`;
          // Es comenta o elimina la part del codi que calculava les accions gastades i mostrava la barra de progrés.
          // const spent = usedPoints();
          // const remaining = actionsAvailable - spent;
          // const pct = Math.min(100, (spent / actionsAvailable) * 100);
          // document.getElementById("actionFill").style.width = pct + "%";
        }


        function resizeMap(){
          const map=document.getElementById("mapContainer");
          const W=window.innerWidth;
          const H=window.innerHeight;
          const maxW=W*(2/3);
          const maxH=H*(2/3);
          let width=maxW;
          let height=width/IMAGE_RATIO;
          if(height>maxH){
            height=maxH;
            width=height*IMAGE_RATIO;
          }
          map.style.width=width+"px";
          map.style.height=height+"px";
        }

        async function drawHexGrid(){
          const svg=document.getElementById("hexGrid");
          const map=document.getElementById("mapContainer");

          svg.innerHTML="";
          hexData=[];
          selectedRed=null;
          highlightedAdjacents=[];
          arrowImages={};
          ordersSet=new Set();
          document.getElementById("orders").innerHTML="";

          svg.insertAdjacentHTML("afterbegin",`
            <defs>
              <pattern id="hatch-red" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
                <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(255,0,0,0.5)" stroke-width="3"/>
              </pattern>
            </defs>
          `);

          const colors=await loadCSV(); // Carga los colores y actualiza actionsAvailable

          const B=map.clientWidth;
          const scale=B/REAL_GRID_WIDTH;
          const R=REAL_R*scale;
          const hexH=Math.sqrt(3)*R;

          const maxRows=Math.max(...PATTERN);
          const gridHeight=(maxRows-1)*hexH+hexH;
          const A=17*R; // Width of the grid based on PATTERN

          const offsetX=(B-A)/2+R;
          const offsetY=(map.clientHeight-gridHeight)/2+hexH/2;

          let id=1;

          PATTERN.forEach((rowCount,col)=>{
            for(let r=0;r<rowCount;r++){
              const cx=offsetX+col*1.5*R;
              const cy=offsetY+r*hexH+(col%2===0?0:hexH/2);

              const pts=[];
              for(let i=0;i<6;i++){
                const ang=Math.PI/3*i;
                pts.push([cx+R*Math.cos(ang),cy+R*Math.sin(ang)].join(","));
              }

              const g=document.createElementNS("http://www.w3.org/2000/svg","g");

              const poly=document.createElementNS("http://www.w3.org/2000/svg","polygon");
              poly.setAttribute("points",pts.join(" "));

              const color=(colors[id]||"").toUpperCase();
              let cls="hex hex-mar";
              if(color.includes("RED")) cls="hex hex-red";
              else if(color.includes("BLUE")) cls="hex hex-blue";

              poly.setAttribute("class",cls);
              poly.dataset.id=id;

              g.appendChild(poly);

              const label=document.createElementNS("http://www.w3.org/2000/svg","text");
              label.setAttribute("x",cx);
              label.setAttribute("y",cy+4);
              label.setAttribute("class","hex-label");
              label.textContent=id;
              g.appendChild(label);

              svg.appendChild(g);

              hexData.push({id,cx,cy,color,element:poly});
              id++;
            }
          });
        }

        function highlightAdjacent(redHex){
          clearHighlights();
          selectedRed=redHex;

          const R=REAL_R*(document.getElementById("mapContainer").clientWidth/REAL_GRID_WIDTH);
          const maxDist=Math.sqrt(3)*R*1.01;

          highlightedAdjacents=[];

          hexData.forEach(h=>{
            if(h.color==="BLUE"){
              const dx=h.cx-redHex.cx;
              const dy=h.cy-redHex.cy;
              const dist=Math.sqrt(dx*dx+dy*dy);
              if(dist<=maxDist){
                h.element.classList.add("hex-hatch");
                highlightedAdjacents.push(h);
              }
            }
          });
        }

        function clearHighlights(){
          highlightedAdjacents.forEach(h=>h.element.classList.remove("hex-hatch"));
          highlightedAdjacents=[];
          selectedRed=null;
        }

        function showWarning(){
          const w=document.getElementById("warning");
          w.classList.add("blink");
          w.style.opacity=1;
          setTimeout(()=>{w.style.opacity=0;w.classList.remove("blink");},2000);
        }

        function showWarningActions(){
          const w=document.getElementById("warningActions");
          w.classList.add("blink");
          w.style.opacity=1;
          setTimeout(()=>{w.style.opacity=0;w.classList.remove("blink");},2000);
        }

        // MODIFICACIÓ: La funció usedPoints() s'elimina ja que no es fa servir.
        // function usedPoints(){ return ordersSet.size*10; }

        function direction(origin,target){
          const dx=target.cx-origin.cx;
          const dy=target.cy-origin.cy;

          if(dy<0 && Math.abs(dx)<Math.abs(dy)) return "N";
          if(dy>0 && Math.abs(dx)<Math.abs(dy)) return "S";
          if(dx>0 && dy<0) return "NE";
          if(dx>0 && dy>0) return "SE";
          if(dx<0 && dy<0) return "NO";
          if(dx<0 && dy>0) return "SO";

          return "N"; // Default direction if calculation is ambiguous
        }

        function arrowURL(dir){
          return {
            "N":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-N.svg",
            "NE":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-NE.svg",
            "NO":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-NO.svg",
            "S":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-S.svg",
            "SE":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-SE.svg",
            "SO":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-SO.svg"
          }[dir];
        }

        function placeArrow(origin,target,key){
          const map=document.getElementById("mapContainer");
          const B=map.clientWidth;
          const scale=B/REAL_GRID_WIDTH;
          const R=REAL_R*scale;
          const hexH=Math.sqrt(3)*R;

          const dir=direction(origin,target);
          const url=arrowURL(dir);

          const img=document.createElement("img");
          img.src=url;
          img.className="attack-arrow attack-arrow--shake attack-arrow--glow";

          const FACTOR=1.42;

          const width = 2 * R * FACTOR;
          const height = hexH * FACTOR;

          img.style.width  = width + "px";
          img.style.height = height + "px";
          img.style.left   = (origin.cx - width/2) + "px";
          img.style.top    = (origin.cy - height/2) + "px";

          map.appendChild(img);
          arrowImages[key]=img;

          setTimeout(()=>{
            if(img) img.classList.remove("attack-arrow--shake");
          },260);
        }

        function removeArrow(key){
          if(arrowImages[key]){
            arrowImages[key].remove();
            delete arrowImages[key];
          }
        }

        // MODIFICACIÓ: S'elimina la comprovació de 'remaining' i la crida a updateActionDisplay()
        function addOrder(originID,targetID){
          const key=`${originID}-${targetID}`;

          if(ordersSet.has(key)){
            showWarning();
            return;
          }

          // const remaining = actionsAvailable - usedPoints(); // Comentada/eliminada la dependència d'accions gastades
          // if(remaining < 10){ // Comentada/eliminada la comprovació de 'remaining'
          //   showWarningActions();
          //   return;
          // }

          ordersSet.add(key);

          // Bloqueig de clics 1 segon + cursor rellotge
          clickLocked = true;
          document.body.style.cursor = "wait";
          setTimeout(() => {
            clickLocked = false;
            document.body.style.cursor = "default";
          }, 1000);

          const origin=hexData.find(h=>h.id===originID);
          const target=hexData.find(h=>h.id===targetID);

          placeArrow(origin,target,key);

          target.element.classList.remove("hex-hatch");

          document.getElementById("moveSound").play();

          const orders=document.getElementById("orders");

          const line=document.createElement("div");
          line.className="order-line";
          line.dataset.key=key;

          const text=document.createElement("span");
          text.textContent=`Ordre d'atac, territori ${originID} a territori ${targetID}`;

          const btn=document.createElement("button");
          btn.textContent="Suspendre ordre";
          btn.className="order-btn";

          btn.onclick=()=>{
            ordersSet.delete(key);
            removeArrow(key);
            line.remove();
            // updateActionDisplay(); // No es crida ja que no hi ha càlculs que actualitzar
          };

          line.appendChild(text);
          line.appendChild(btn);
          orders.appendChild(line);

          // updateActionDisplay(); // No es crida ja que no hi ha càlculs que actualitzar
        }

        function setupClickHandler(){
          const svg=document.getElementById("hexGrid");

          svg.addEventListener("click", e => {
            if (clickLocked) return;

            hexData.forEach(h=>h.element.classList.remove("hex-hatch"));

            const poly=e.target.closest("polygon");
            if(!poly){
              clearHighlights();
              return;
            }

            const id=parseInt(poly.dataset.id);
            const hex=hexData.find(h=>h.id===id);

            if(hex.color==="RED"){
              highlightAdjacent(hex);
              return;
            }

            if(selectedRed && highlightedAdjacents.some(h=>h.id===id)){
              addOrder(selectedRed.id,hex.id);
              return;
            }

            clearHighlights();
          });
        }

        function redraw(){
          resizeMap();
          drawHexGrid().then(()=>{
            setupClickHandler();
            updateActionDisplay(); // Assegura que la visualització inicial és correcta
          });
        }

        window.addEventListener("resize",redraw);
        redraw();
        checkLockState(); // Comprova l'estat inicial del bloqueig

        // Botó Confirmar ordres: bloqueig 5s, cursor rellotge i enviament seqüencial
        document.getElementById("confirmBtn").addEventListener("click", async () => {
          const btn = document.getElementById("confirmBtn");

          if (btn._sheetLocked || btn._tempLocked) return;

          btn._tempLocked = true;
          btn.disabled = true;
          btn.style.background = "#555";
          btn.style.color = "#999";
          btn.style.cursor = "not-allowed";
          document.body.style.cursor = "wait";

          setTimeout(() => {
            btn._tempLocked = false;
            document.body.style.cursor = "default";
            checkLockState(); // Torna a comprovar l'estat del bloqueig després del tempLocked
          }, 5000);

          document.getElementById("ordersSound").play();

          const url = "https://script.google.com/macros/s/AKfycbzMGXDTpJXy2jGjGxPT5g27kOntPOEj6aO-ap_8KIPqi1iyR-FQknxpNva-QqqTXxt_/exec";
          const lines = document.querySelectorAll(".order-line");

          for (const line of lines) {
            const text = line.querySelector("span").textContent;

            // No cal comprovar 'actionsAvailable' abans d'enviar, ja que s'elimina el càlcul d'accions gastades.
            await fetch(url, {
              method: "POST",
              mode: "no-cors", // Important per evitar CORS errors amb Google Apps Script
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ orderText: text })
            });

            await new Promise(res => setTimeout(res, 150)); // Petita pausa entre enviaments
          }
        });
    </script>
</body>
</html>
