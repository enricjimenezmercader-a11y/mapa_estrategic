<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mapa Informatiu Global — Estat de la Guerra</title>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      background:#05050a;
      color:#fff;
      font-family:Arial,Helvetica,sans-serif;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      padding-top:20px;
      gap:20px;
    }

    #titleBar{
      font-size:28px;
      font-weight:bold;
      text-align:center;
      letter-spacing:1px;
      text-shadow: 0 0 10px rgba(255,255,255,0.2);
    }

    .map-container{
      position:relative;
      background:#111;
      border:2px solid #333;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      overflow:hidden;
    }

    .map-image{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:contain;
      z-index:1;
      pointer-events:none;
    }

    svg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      z-index:10;
      pointer-events:none; /* Mode informatiu: bloqueja interaccions de clic */
    }

    .hex{
      stroke:#000;
      stroke-width:2;
    }

    .hex-red{ fill:rgba(255,0,0,0.3); }
    .hex-blue{ fill:rgba(0,120,255,0.3); }
    .hex-mar{ fill:rgba(120,120,120,0.25); }

    .hex-label{
      fill:#fff;
      font-weight:bold;
      text-anchor:middle;
      stroke:#000;
      stroke-width:0.8;
      font-size:12px;
    }

    .attack-arrow{
      position:absolute;
      pointer-events:none;
      z-index:20;
      transform-origin:center center;
    }

    @keyframes glow {
      0%   { filter: drop-shadow(0 0 2px #fff); opacity: 0.85; }
      50%  { filter: drop-shadow(0 0 14px #ffff66); opacity: 1; }
      100% { filter: drop-shadow(0 0 2px #fff); opacity: 0.85; }
    }
    .attack-arrow--glow{
      animation:glow 2s ease-in-out infinite;
    }
    
    #loadingIndicator {
      font-size: 14px;
      color: #888;
      font-family: monospace;
    }
  </style>
</head>

<body>

<div id="titleBar">PANEL INFORMATIU GLOBAL — RADAR TÀCTIC</div>
<div id="loadingIndicator">Sincronitzant dades amb el quarter general...</div>

<div class="map-container" id="mapContainer">
  <img class="map-image"
       src="https://github.com/enricjimenezmercader-a11y/mapa_estrategic/blob/481d1cc0765b31581a6f050a7f68d53400172e48/map_hex.jpg?raw=true"
       alt="Mapa estratègic">

  <svg id="hexGrid"></svg>
</div>

<script>
const PATTERN=[5,4,5,4,5,4,5,4,5,4,5];

// 1. URL per carregar l'estat dels colors dels hexàgons
const COLORS_JSON_URL="https://script.google.com/macros/s/AKfycbyM44gMczZ9XQvIJhAcKaBx9CPbMNAXEgVze1ClXJIZ6VOkZJxSxPKwrmQj57_KjLyX/exec";

// 2. URL del teu Google Apps Script d'ordres globals unificat
const ORDERS_JSON_URL="https://script.google.com/macros/s/AKfycbwp_Qy6vzBUuo2jK0gtI-9hdUY3mFZ41BPIf6VZqyGwPpEBZh0KnUGqOdTiBgZXm4YF1A/exec";

const REAL_R=41.78;
const REAL_GRID_WIDTH=17*REAL_R;
const IMAGE_RATIO=1.4;

let hexData=[];
let arrowElements=[]; 

// Funció genèrica de lectura JSONP segura per evitar problemes de CORS
async function fetchJSONP(url){
  return new Promise((resolve, reject) => {
    const callbackName = 'jsonpCallback_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    
    const timeout = setTimeout(() => {
      if (window[callbackName]) {
        delete window[window[callbackName]];
        try { document.head.removeChild(script); } catch(e) {}
        reject(new Error('Timeout carregant dades'));
      }
    }, 5000);

    window[callbackName] = function(data) {
      clearTimeout(timeout);
      delete window[callbackName];
      try { document.head.removeChild(script); } catch(e) {}
      resolve(data);
    };
    
    const script = document.createElement('script');
    script.src = url + (url.includes('?') ? '&' : '?') + "callback=" + callbackName;
    script.type = 'text/javascript';
    
    script.onerror = function() {
      clearTimeout(timeout);
      if (window[callbackName]) {
        delete window[callbackName];
        try { document.head.removeChild(script); } catch(e) {}
      }
      reject(new Error('Error de connexió'));
    };
    
    document.head.appendChild(script);
  });
}

function resizeMap(){
  const map=document.getElementById("mapContainer");
  const W=window.innerWidth;
  const H=window.innerHeight;
  const maxW=W*(0.85);
  const maxH=H*(0.80);
  let width=maxW;
  let height=width/IMAGE_RATIO;
  if(height>maxH){
    height=maxH;
    width=height*IMAGE_RATIO;
  }
  map.style.width=width+"px";
  map.style.height=height+"px";
}

// Inicialitza la graella geomètrica dels hexàgons
function initHexGridStructure(){
  const svg=document.getElementById("hexGrid");
  const map=document.getElementById("mapContainer");

  svg.innerHTML="";
  hexData=[];

  const B=map.clientWidth;
  const scale=B/REAL_GRID_WIDTH;
  const R=REAL_R*scale;
  const hexH=Math.sqrt(3)*R;

  const maxRows=Math.max(...PATTERN);
  const gridHeight=(maxRows-1)*hexH+hexH;
  const A=17*R;

  const offsetX=(B-A)/2+R;
  const offsetY=(map.clientHeight-gridHeight)/2+hexH/2;

  let id=1;

  PATTERN.forEach((rowCount,col)=>{
    for(let r=0;r<rowCount;r++){
      const cx=offsetX+col*1.5*R;
      const cy=offsetY+r*hexH+(col%2===0?0:hexH/2);

      const pts=[];
      for(let i=0;i<6;i++){
        const ang=Math.PI/3*i;
        pts.push([cx+R*Math.cos(ang),cy+R*Math.sin(ang)].join(","));
      }

      const g=document.createElementNS("http://www.w3.org/2000/svg","g");

      const poly=document.createElementNS("http://www.w3.org/2000/svg","polygon");
      poly.setAttribute("points",pts.join(" "));
      poly.setAttribute("class","hex hex-mar"); 
      poly.dataset.id=id;
      g.appendChild(poly);

      const label=document.createElementNS("http://www.w3.org/2000/svg","text");
      label.setAttribute("x",cx);
      label.setAttribute("y",cy+4);
      label.setAttribute("class","hex-label");
      label.textContent=id;
      g.appendChild(label);

      svg.appendChild(g);

      hexData.push({id,cx,cy,color:"MAR",element:poly});
      id++;
    }
  });
}

// Sincronitza l'estat dels colors de fons
async function updateHexColors(){
  try {
    const data = await fetchJSONP(COLORS_JSON_URL);
    if (Array.isArray(data)) {
      data.forEach(row => {
        const id = parseInt(row["A"]);
        const color = (row["B"] || "MAR").toUpperCase();
        
        const hex = hexData.find(h => h.id === id);
        if(hex) {
          hex.color = color;
          let cls = "hex hex-mar";
          if(color.includes("RED")) cls = "hex hex-red";
          else if(color.includes("BLUE")) cls = "hex hex-blue";
          hex.element.setAttribute("class", cls);
        }
      });
    }
  } catch(e) {
    console.log("Error sincronitzant colors mapa:", e);
  }
}

// Sincronitza les ordres reals i dibuixa les fletxes vectorials
async function updateActiveOrders(){
  try {
    // Netejar fletxes del cicle anterior
    arrowElements.forEach(img => img.remove());
    arrowElements = [];

    const orderStrings = await fetchJSONP(ORDERS_JSON_URL);
    
    if (Array.isArray(orderStrings)) {
      orderStrings.forEach(orderText => {
        // Filtra el patró de text "territori X a territori Y"
        const match = orderText.match(/territori\s+(\d+)\s+a\s+territori\s+(\d+)/i);
        if (match) {
          const originID = parseInt(match[1]);
          const targetID = parseInt(match[2]);

          const originHex = hexData.find(h => h.id === originID);
          const targetHex = hexData.find(h => h.id === targetID);

          if (originHex && targetHex) {
            placeInformativeArrow(originHex, targetHex);
          }
        }
      });
      
      const d = new Date();
      document.getElementById("loadingIndicator").textContent = `Radar sincronitzat: Darrera actualització a les ${d.toLocaleTimeString()}`;
    }
  } catch(e) {
    console.log("Error buscant noves ordres:", e);
  }
}

function direction(origin,target){
  const dx=target.cx-origin.cx;
  const dy=target.cy-origin.cy;
  if(dy<0 && Math.abs(dx)<Math.abs(dy)) return "N";
  if(dy>0 && Math.abs(dx)<Math.abs(dy)) return "S";
  if(dx>0 && dy<0) return "NE";
  if(dx>0 && dy>0) return "SE";
  if(dx<0 && dy<0) return "NO";
  if(dx<0 && dy>0) return "SO";
  return "N";
}

function arrowURL(dir){
  return {
    "N":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-N.svg",
    "NE":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-NE.svg",
    "NO":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-NO.svg",
    "S":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-S.svg",
    "SE":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-SE.svg",
    "SO":"https://raw.githubusercontent.com/enricjimenezmercader-a11y/mapa_estrategic/main/AT-SO.svg"
  }[dir];
}

function placeInformativeArrow(origin,target){
  const map=document.getElementById("mapContainer");
  const B=map.clientWidth;
  const scale=B/REAL_GRID_WIDTH;
  const R=REAL_R*scale;
  const hexH=Math.sqrt(3)*R;

  const dir=direction(origin,target);
  const url=arrowURL(dir);

  const img=document.createElement("img");
  img.src=url;
  img.className="attack-arrow attack-arrow--glow"; 

  const FACTOR=1.42;
  const width = 2 * R * FACTOR;
  const height = hexH * FACTOR;

  img.style.width  = width + "px";
  img.style.height = height + "px";
  img.style.left   = (origin.cx - width/2) + "px";
  img.style.top    = (origin.cy - height/2) + "px";

  map.appendChild(img);
  arrowElements.push(img);
}

// Unificació del bucle de refresc global
async function syncRadarData(){
  await updateHexColors();
  await updateActiveOrders();
}

function fullRedraw(){
  resizeMap();
  initHexGridStructure();
  syncRadarData();
}

// Controladors de pantalla dinàmics
window.addEventListener("resize", fullRedraw);

// Càrrega i renderitzat inicial
resizeMap();
initHexGridStructure();
setTimeout(syncRadarData, 500);

// Rellotge automàtic actiu cada 5000 mil·lisegons
setInterval(syncRadarData, 5000);
</script>

</body>
</html>
